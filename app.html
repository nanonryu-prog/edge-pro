<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EDGE Pro — Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    color-scheme:dark;
    --bg:#0A0A16; --bg-2:#0E0E20; --surface:#14142A; --surface-2:#1A1A36;
    --border:rgba(255,255,255,0.08); --border-2:rgba(255,255,255,0.14);
    --text:#F4F4FB; --muted:rgba(244,244,251,0.62); --faint:rgba(244,244,251,0.40);
    --violet:#7C5CFC; --violet-2:#9D7BFF; --pink:#E15CC6;
    --grad:linear-gradient(135deg,#7C5CFC 0%,#A45CFC 45%,#E15CC6 100%);
    --win:#24D19B; --loss:#F5476B; --gold:#FFC43D;
    --ease:cubic-bezier(0.16,1,0.3,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;letter-spacing:-0.011em;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Space Grotesk','Inter',sans-serif;letter-spacing:-0.02em;margin:0;}
  a{color:inherit;text-decoration:none;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .tabular{font-variant-numeric:tabular-nums;}
  ::-webkit-scrollbar{width:10px;height:10px;} ::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:6px;}

  /* shell */
  .shell{display:grid;grid-template-columns:248px 1fr;min-height:100dvh;}
  @media (max-width:820px){ .shell{grid-template-columns:1fr;} .sidebar{display:none;} }

  /* sidebar */
  .sidebar{background:linear-gradient(180deg,var(--bg-2),var(--bg));border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100dvh;}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk';font-weight:700;font-size:18px;padding:6px 8px 20px;}
  .brand-mark{width:32px;height:32px;border-radius:9px;background:var(--grad);display:grid;place-items:center;box-shadow:0 6px 18px rgba(124,92,252,0.5);}
  .nav-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;color:var(--muted);font-weight:500;font-size:14.5px;cursor:pointer;transition:background .18s var(--ease),color .18s var(--ease);border:none;background:transparent;width:100%;text-align:left;}
  .nav-item svg{width:19px;height:19px;flex:none;}
  .nav-item:hover{background:rgba(255,255,255,0.05);color:var(--text);}
  .nav-item.active{background:rgba(124,92,252,0.16);color:#fff;}
  .nav-item.active svg{color:var(--violet-2);}
  .side-foot{margin-top:auto;border-top:1px solid var(--border);padding-top:14px;}
  .user-chip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:11px;}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;}
  .user-chip .nm{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .user-chip .em{font-size:11.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .logout{margin-top:6px;font-size:13px;color:var(--muted);display:flex;gap:9px;align-items:center;padding:9px 12px;border-radius:10px;cursor:pointer;background:transparent;border:none;width:100%;}
  .logout:hover{background:rgba(245,71,107,0.12);color:var(--loss);}

  /* main */
  main{min-width:0;}
  .topbar{position:sticky;top:0;z-index:10;background:rgba(10,10,22,0.8);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:16px 28px;gap:16px;}
  .topbar h1{font-size:21px;}
  .topbar .sub{font-size:12.5px;color:var(--faint);margin-top:2px;}
  .mobile-nav{display:none;}
  @media (max-width:820px){ .mobile-nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--border);}
    .mobile-nav .nav-item{width:auto;white-space:nowrap;padding:8px 12px;} .topbar{padding:14px 16px;} .content{padding:18px 16px !important;} }
  .content{padding:28px;max-width:1200px;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:11px;font-weight:600;font-size:14px;cursor:pointer;border:1px solid transparent;transition:transform .16s var(--ease),box-shadow .2s var(--ease),background .2s;}
  .btn-primary{background:var(--grad);color:#fff;box-shadow:0 8px 22px rgba(124,92,252,0.4);}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(124,92,252,0.55);}
  .btn-ghost{background:rgba(255,255,255,0.05);border-color:var(--border-2);color:var(--text);}
  .btn-ghost:hover{background:rgba(255,255,255,0.1);}
  .btn-sm{height:36px;padding:0 14px;font-size:13px;}
  .btn-danger{background:rgba(245,71,107,0.14);border-color:rgba(245,71,107,0.3);color:var(--loss);}
  .btn-danger:hover{background:rgba(245,71,107,0.24);}

  /* cards + grid */
  .grid{display:grid;gap:16px;}
  .kpis{grid-template-columns:repeat(2,1fr);}
  @media(min-width:720px){ .kpis{grid-template-columns:repeat(4,1fr);} }
  .card{background:linear-gradient(180deg,var(--surface),var(--bg-2));border:1px solid var(--border);border-radius:16px;padding:20px;}
  .klabel{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--faint);font-weight:600;}
  .kval{font-family:'Space Grotesk';font-weight:700;font-size:28px;margin-top:8px;}
  .kval.win{color:var(--win);} .kval.loss{color:var(--loss);}
  .ksub{font-size:12px;color:var(--faint);margin-top:4px;}
  .grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}

  .card-title{font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .two-col{display:grid;gap:16px;grid-template-columns:1fr;}
  @media(min-width:900px){ .two-col{grid-template-columns:1.6fr 1fr;} }

  /* forms */
  .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  @media(min-width:640px){ .form-grid{grid-template-columns:repeat(3,1fr);} }
  .fgrp{display:flex;flex-direction:column;gap:6px;}
  .fgrp.full{grid-column:1/-1;}
  .flbl{font-size:12.5px;color:var(--muted);font-weight:500;}
  .finp{height:44px;border-radius:10px;border:1px solid var(--border-2);background:rgba(255,255,255,0.04);color:var(--text);padding:0 13px;font-size:14px;font-family:inherit;}
  textarea.finp{height:auto;min-height:84px;padding:11px 13px;resize:vertical;}
  select.finp{cursor:pointer;}
  .finp:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,92,252,0.18);background:rgba(124,92,252,0.05);}

  /* checklist */
  .rule{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--border);border-radius:11px;margin-bottom:8px;cursor:pointer;transition:border-color .2s,background .2s;}
  .rule:hover{border-color:var(--border-2);}
  .rule.on{border-color:rgba(36,209,155,0.4);background:rgba(36,209,155,0.08);}
  .rule .box{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--border-2);display:grid;place-items:center;flex:none;color:transparent;transition:.15s;}
  .rule.on .box{background:var(--win);border-color:var(--win);color:#04120c;}
  .rule .t{font-size:13.5px;}

  /* table */
  .tbl{width:100%;border-collapse:collapse;font-size:13.5px;}
  .tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--border);}
  .tbl td{padding:12px;border-bottom:1px solid var(--border);}
  .tbl tr:hover td{background:rgba(255,255,255,0.02);}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;}
  .pill.long{background:rgba(36,209,155,0.14);color:var(--win);}
  .pill.short{background:rgba(245,71,107,0.14);color:var(--loss);}
  .pos{color:var(--win);} .neg{color:var(--loss);}
  .del-x{background:transparent;border:none;color:var(--faint);cursor:pointer;padding:4px;border-radius:6px;}
  .del-x:hover{color:var(--loss);background:rgba(245,71,107,0.12);}

  /* empty state */
  .empty{text-align:center;padding:54px 20px;color:var(--muted);}
  .empty .ei{width:60px;height:60px;border-radius:16px;background:rgba(124,92,252,0.12);border:1px solid rgba(124,92,252,0.28);display:grid;place-items:center;margin:0 auto 16px;color:var(--violet-2);}
  .empty h3{font-size:18px;margin-bottom:6px;}

  /* discipline ring */
  .ring-wrap{position:relative;width:150px;height:150px;margin:6px auto;}
  .ring-num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;}
  .ring-num .n{font-family:'Space Grotesk';font-weight:700;font-size:34px;}

  /* calendar */
  .cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;}
  .cal-dow span{text-align:center;font-size:10.5px;color:var(--faint);font-weight:600;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-day{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;border:1px solid var(--border);background:rgba(255,255,255,0.02);color:var(--faint);}
  .cal-day .pl{font-weight:700;font-size:10px;}
  .cal-day.win{background:rgba(36,209,155,0.14);border-color:rgba(36,209,155,0.32);} .cal-day.win .pl{color:var(--win);}
  .cal-day.loss{background:rgba(245,71,107,0.13);border-color:rgba(245,71,107,0.3);} .cal-day.loss .pl{color:var(--loss);}
  .cal-day.slip{background:rgba(255,196,0,0.13);border-color:rgba(255,196,0,0.34);} .cal-day.slip .pl{color:var(--gold);}

  /* progress / xp */
  .xp-track{height:12px;border-radius:8px;background:rgba(255,255,255,0.07);overflow:hidden;margin:10px 0 6px;}
  .xp-fill{height:100%;background:var(--grad);border-radius:8px;transition:width .8s var(--ease);}
  .ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  .ach{padding:16px;border-radius:13px;border:1px solid var(--border);background:rgba(255,255,255,0.02);text-align:center;opacity:.45;transition:.25s;}
  .ach.on{opacity:1;border-color:rgba(255,196,0,0.35);background:rgba(255,196,0,0.06);}
  .ach .ic{font-size:24px;margin-bottom:8px;}
  .ach .an{font-size:13px;font-weight:600;}
  .ach .ad{font-size:11px;color:var(--faint);margin-top:3px;}

  .equity-val{font-family:'Space Grotesk';font-weight:700;font-size:26px;}
  .chip-list{display:flex;flex-wrap:wrap;gap:8px;}
  .rule-chip{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:rgba(124,92,252,0.1);border:1px solid rgba(124,92,252,0.3);font-size:13px;}
  .rule-chip button{background:none;border:none;color:var(--faint);cursor:pointer;font-size:15px;line-height:1;}
  .rule-chip button:hover{color:var(--loss);}

  /* toast */
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface-2);border:1px solid var(--border-2);color:var(--text);padding:13px 20px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 16px 40px rgba(0,0,0,0.5);opacity:0;pointer-events:none;transition:.3s var(--ease);z-index:100;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #toast.good{border-color:rgba(36,209,155,0.4);} #toast.bad{border-color:rgba(245,71,107,0.4);}

  .hint{font-size:12px;color:var(--faint);}
  .section-gap{margin-top:16px;}
</style>
</head>
<body>
<div class="shell">
  <!-- Sidebar -->
  <aside class="sidebar">
    <a href="index.html" class="brand"><span class="brand-mark"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/></svg></span>EDGE Pro</a>
    <nav id="sideNav"></nav>
    <div class="side-foot">
      <div class="user-chip"><span class="avatar" id="uAvatar">–</span><div style="min-width:0"><div class="nm" id="uName">–</div><div class="em" id="uEmail">–</div></div></div>
      <button class="logout" id="logoutBtn"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>Log out</button>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div><h1 id="pageTitle">Dashboard</h1><div class="sub" id="pageSub">Your trading at a glance</div></div>
      <button class="btn btn-primary btn-sm" onclick="go('log')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Log trade</button>
    </div>
    <div class="mobile-nav" id="mobileNav"></div>
    <div class="content" id="view"></div>
  </main>
</div>
<div id="toast"></div>

<script>
/* ============================================================
   EDGE Pro — in-browser backend (localStorage).
   Swap `Store` methods for real API/Supabase calls later.
   ============================================================ */
const Store = {
  sessionKey:'edgepro_session',
  session(){ try{return JSON.parse(localStorage.getItem(this.sessionKey));}catch{return null;} },
  logout(){ localStorage.removeItem(this.sessionKey); location.href='login.html'; },
  k(base){ const s=this.session(); return `edgepro_${base}_${s?s.email:'anon'}`; },
  getTrades(){ try{return JSON.parse(localStorage.getItem(this.k('trades')))||[];}catch{return [];} },
  saveTrades(t){ localStorage.setItem(this.k('trades'),JSON.stringify(t)); },
  getRules(){ try{return JSON.parse(localStorage.getItem(this.k('rules')))|| defaultRules();}catch{return defaultRules();} },
  saveRules(r){ localStorage.setItem(this.k('rules'),JSON.stringify(r)); },
  getProfile(){ try{return JSON.parse(localStorage.getItem(this.k('profile')))||{xp:0};}catch{return {xp:0};} },
  saveProfile(p){ localStorage.setItem(this.k('profile'),JSON.stringify(p)); },
};
function defaultRules(){ return ['Setup matches my playbook','Stop loss is set before entry','Risk ≤ 1% of account','Not revenge trading','Within my session hours']; }

// ---- auth gate ----
const session = Store.session();
if(!session){ location.href='login.html'; }

// ---- helpers ----
const $=(s,r=document)=>r.querySelector(s);
const money=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString();
const fmtDate=d=>new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric'});
function toast(msg,kind=''){ const t=$('#toast'); t.textContent=msg; t.className='show '+kind; setTimeout(()=>t.className='',2600); }

function stats(){
  const tr=Store.getTrades();
  const wins=tr.filter(t=>t.pnl>0), losses=tr.filter(t=>t.pnl<0);
  const gw=wins.reduce((a,t)=>a+t.pnl,0), gl=Math.abs(losses.reduce((a,t)=>a+t.pnl,0));
  const net=tr.reduce((a,t)=>a+t.pnl,0);
  const wr=tr.length?Math.round(wins.length/tr.length*100):0;
  const pf=gl?(gw/gl):(gw?Infinity:0);
  const disTr=tr.filter(t=>t.rulesTotal>0);
  const dis=disTr.length?Math.round(disTr.reduce((a,t)=>a+t.rulesFollowed/t.rulesTotal,0)/disTr.length*100):0;
  return {tr,wins:wins.length,losses:losses.length,net,wr,pf,dis,gw,gl};
}
function levelInfo(){ const xp=Store.getProfile().xp||0; const lvl=Math.floor(xp/100)+1; return {xp,lvl,into:xp%100,need:100}; }

/* ---------------- NAV ---------------- */
const NAV=[
  ['dash','Dashboard','<path d="M3 13h8V3H3zM13 21h8V3h-8zM3 21h8v-6H3z"/>'],
  ['log','Log Trade','<path d="M12 5v14M5 12h14"/>'],
  ['history','History','<path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/>'],
  ['calendar','Calendar','<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>'],
  ['playbook','Playbook','<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/>'],
  ['progress','Progress','<path d="M4 22h16"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>'],
];
const SUBS={dash:'Your trading at a glance',log:'Confirm your rules, then log the trade',history:'Every trade you have logged',calendar:'Your month, coloured by discipline',playbook:'The rules that power your checklist',progress:'XP, levels & achievements'};
let current='dash';
function buildNav(){
  const html=NAV.map(([id,label,ico])=>`<button class="nav-item${id===current?' active':''}" data-go="${id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ico}</svg>${label}</button>`).join('');
  $('#sideNav').innerHTML=html; $('#mobileNav').innerHTML=html;
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
}
function go(id){ current=id; buildNav(); $('#pageTitle').textContent=NAV.find(n=>n[0]===id)[1]; $('#pageSub').textContent=SUBS[id]; VIEWS[id](); window.scrollTo(0,0); }

/* ---------------- VIEWS ---------------- */
const VIEWS={};

VIEWS.dash=function(){
  const s=stats(); const v=$('#view');
  if(!s.tr.length){ v.innerHTML=emptyState('No trades yet','Log your first trade to see your stats, equity curve and discipline score come to life.','log','Log your first trade'); return; }
  const li=levelInfo();
  v.innerHTML=`
    <div class="grid kpis">
      ${kpi('Net P&L',money(s.net),s.net>=0?'win':'loss',s.tr.length+' trades')}
      ${kpi('Win rate',s.wr+'%','', s.wins+'W / '+s.losses+'L')}
      ${kpi('Profit factor',s.pf===Infinity?'∞':s.pf.toFixed(2),'', 'gross wins ÷ losses')}
      ${kpi('Discipline',s.dis+'<span style="font-size:15px;color:var(--faint)">/100</span>','', 'rules followed')}
    </div>
    <div class="two-col section-gap">
      <div class="card">
        <div class="card-title"><span>Equity curve</span><span class="equity-val ${s.net>=0?'pos':'neg'}">${money(s.net)}</span></div>
        ${equitySVG(s.tr)}
      </div>
      <div class="card">
        <div class="card-title">Discipline score</div>
        ${ring(s.dis)}
        <div style="text-align:center;font-size:12.5px;color:var(--faint);margin-top:8px;">Level ${li.lvl} · ${li.xp} XP</div>
      </div>
    </div>
    <div class="card section-gap">
      <div class="card-title"><span>Recent trades</span><button class="btn btn-ghost btn-sm" onclick="go('history')">View all</button></div>
      ${tradeTable(s.tr.slice().reverse().slice(0,5),false)}
    </div>`;
};

VIEWS.log=function(){
  const rules=Store.getRules(); const v=$('#view');
  v.innerHTML=`
  <div class="card">
    <div class="card-title">Pre-trade checklist <span class="hint" id="clProg">0 / ${rules.length} confirmed</span></div>
    <div id="checklist">${rules.map((r,i)=>`<div class="rule" data-i="${i}"><span class="box"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span><span class="t">${r}</span></div>`).join('')||'<div class="hint">No rules yet — add them in Playbook.</div>'}</div>
  </div>
  <form class="card section-gap" id="tradeForm">
    <div class="card-title">Trade details</div>
    <div class="form-grid">
      <div class="fgrp"><label class="flbl">Date</label><input class="finp" type="date" id="f-date"></div>
      <div class="fgrp"><label class="flbl">Symbol</label><input class="finp" id="f-sym" placeholder="EURUSD" required></div>
      <div class="fgrp"><label class="flbl">Side</label><select class="finp" id="f-side"><option value="long">Long</option><option value="short">Short</option></select></div>
      <div class="fgrp"><label class="flbl">Entry price</label><input class="finp" type="number" step="any" id="f-entry" placeholder="1.0850" oninput="calcPnl()"></div>
      <div class="fgrp"><label class="flbl">Exit price</label><input class="finp" type="number" step="any" id="f-exit" placeholder="1.0910" oninput="calcPnl()"></div>
      <div class="fgrp"><label class="flbl">Size (units)</label><input class="finp" type="number" step="any" id="f-size" placeholder="10000" oninput="calcPnl()"></div>
      <div class="fgrp"><label class="flbl">Stop (optional)</label><input class="finp" type="number" step="any" id="f-stop" oninput="calcRR()"></div>
      <div class="fgrp"><label class="flbl">Target (optional)</label><input class="finp" type="number" step="any" id="f-target" oninput="calcRR()"></div>
      <div class="fgrp"><label class="flbl">Emotion</label><select class="finp" id="f-emotion"><option>Calm</option><option>Confident</option><option>FOMO</option><option>Fear</option><option>Greed</option><option>Revenge</option></select></div>
      <div class="fgrp"><label class="flbl">P&L ($)</label><input class="finp tabular" type="number" step="any" id="f-pnl" placeholder="auto"></div>
      <div class="fgrp"><label class="flbl">R:R</label><input class="finp tabular" id="f-rr" placeholder="auto" readonly></div>
      <div class="fgrp full"><label class="flbl">Notes</label><textarea class="finp" id="f-notes" placeholder="What was the setup? What did you see?"></textarea></div>
    </div>
    <div style="display:flex;gap:12px;margin-top:18px;flex-wrap:wrap;">
      <button type="submit" class="btn btn-primary">Save trade (+10 XP)</button>
      <button type="button" class="btn btn-ghost" onclick="go('dash')">Cancel</button>
    </div>
  </form>`;
  $('#f-date').value=new Date().toISOString().slice(0,10);
  document.querySelectorAll('#checklist .rule').forEach(r=>r.onclick=()=>{ r.classList.toggle('on'); const n=document.querySelectorAll('#checklist .rule.on').length; $('#clProg').textContent=`${n} / ${rules.length} confirmed`; });
  $('#tradeForm').onsubmit=saveTrade;
};

VIEWS.history=function(){
  const tr=Store.getTrades().slice().reverse(); const v=$('#view');
  if(!tr.length){ v.innerHTML=emptyState('No trades yet','Once you log trades they appear here with full detail.','log','Log a trade'); return; }
  v.innerHTML=`<div class="card"><div class="card-title"><span>${tr.length} trades</span></div>${tradeTable(tr,true)}</div>`;
};

VIEWS.calendar=function(){
  const tr=Store.getTrades(); const v=$('#view');
  const now=new Date(); const y=now.getFullYear(), m=now.getMonth();
  const byDay={};
  tr.forEach(t=>{ const d=new Date(t.date); if(d.getFullYear()===y&&d.getMonth()===m){ const day=d.getDate(); (byDay[day]=byDay[day]||{pl:0,slip:false,n:0}); byDay[day].pl+=t.pnl; byDay[day].n++; if(t.rulesTotal>0 && t.rulesFollowed<t.rulesTotal) byDay[day].slip=true; } });
  const first=(new Date(y,m,1).getDay()+6)%7; const dim=new Date(y,m+1,0).getDate();
  let cells=''; for(let i=0;i<first;i++) cells+='<div></div>';
  for(let d=1;d<=dim;d++){ const e=byDay[d]; let cls='cal-day',inner=`<span>${d}</span>`;
    if(e){ cls+=e.slip?' slip':(e.pl>=0?' win':' loss'); inner+=`<span class="pl">${e.pl>=0?'+':'-'}$${Math.abs(Math.round(e.pl))}</span>`; }
    cells+=`<div class="${cls}">${inner}</div>`; }
  const net=tr.filter(t=>{const d=new Date(t.date);return d.getFullYear()===y&&d.getMonth()===m;}).reduce((a,t)=>a+t.pnl,0);
  v.innerHTML=`<div class="card" style="max-width:640px;">
    <div class="card-title"><span>${now.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</span><span class="${net>=0?'pos':'neg'}" style="font-weight:700">Net ${money(net)}</span></div>
    <div class="cal-dow"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
    <div class="cal-grid">${cells}</div>
    <div class="chip-list" style="margin-top:14px;font-size:11.5px;color:var(--faint)"><span>🟢 Profit</span><span>🔴 Loss</span><span>🟡 Rule slip</span></div>
  </div>`;
};

VIEWS.playbook=function(){
  const rules=Store.getRules(); const v=$('#view');
  v.innerHTML=`<div class="card" style="max-width:720px;">
    <div class="card-title">Your trading rules</div>
    <p class="hint" style="margin:-6px 0 14px">These power your pre-trade checklist and your discipline grade. Confirm every one before you take a trade.</p>
    <div class="chip-list" id="ruleChips">${rules.map((r,i)=>`<span class="rule-chip">${r}<button data-del="${i}">×</button></span>`).join('')||'<span class="hint">No rules yet.</span>'}</div>
    <div style="display:flex;gap:10px;margin-top:18px;">
      <input class="finp" id="newRule" placeholder="e.g. Only trade my A+ setups" style="flex:1" onkeydown="if(event.key==='Enter'){event.preventDefault();addRule();}">
      <button class="btn btn-primary btn-sm" onclick="addRule()">Add rule</button>
    </div>
  </div>`;
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ const r=Store.getRules(); r.splice(+b.dataset.del,1); Store.saveRules(r); VIEWS.playbook(); toast('Rule removed'); });
};

VIEWS.progress=function(){
  const li=levelInfo(); const s=stats(); const v=$('#view');
  const streak=disciplineStreak();
  const ach=[
    ['🥇','First Trade','Log your first trade',s.tr.length>=1],
    ['📓','10 Trades','Build the habit',s.tr.length>=10],
    ['🏅','50-Trade Record','Complete your track record',s.tr.length>=50],
    ['🔥','Discipline Streak','5 rule-following trades in a row',streak>=5],
    ['💎','Discipline 90+','Reach a 90+ discipline score',s.dis>=90],
    ['💰','First Green Week','Finish a week net positive',s.net>0&&s.tr.length>=5],
  ];
  v.innerHTML=`
    <div class="card" style="max-width:720px;">
      <div class="card-title"><span>Level ${li.lvl}</span><span class="hint">${li.xp} XP total</span></div>
      <div class="xp-track"><div class="xp-fill" style="width:${li.into}%"></div></div>
      <div class="hint">${li.into} / ${li.need} XP to level ${li.lvl+1}</div>
    </div>
    <div class="card section-gap"><div class="card-title">Achievements</div>
      <div class="ach-grid">${ach.map(([ic,n,d,on])=>`<div class="ach ${on?'on':''}"><div class="ic">${ic}</div><div class="an">${n}</div><div class="ad">${d}</div></div>`).join('')}</div>
    </div>`;
};

/* ---------------- actions ---------------- */
function calcPnl(){ const e=+$('#f-entry').value,x=+$('#f-exit').value,sz=+$('#f-size').value,side=$('#f-side').value;
  if(e&&x&&sz){ const pnl=(x-e)*sz*(side==='long'?1:-1); $('#f-pnl').value=Math.round(pnl*100)/100; } }
function calcRR(){ const e=+$('#f-entry').value,s=+$('#f-stop').value,t=+$('#f-target').value;
  if(e&&s&&t&&e-s!==0){ $('#f-rr').value=(Math.abs(t-e)/Math.abs(e-s)).toFixed(2); } }
function saveTrade(ev){ ev.preventDefault();
  const rules=Store.getRules();
  const followed=document.querySelectorAll('#checklist .rule.on').length;
  const pnl=parseFloat($('#f-pnl').value)||0;
  const t={ id:Date.now(), date:$('#f-date').value||new Date().toISOString().slice(0,10),
    symbol:($('#f-sym').value||'—').toUpperCase(), side:$('#f-side').value,
    entry:+$('#f-entry').value||null, exit:+$('#f-exit').value||null, size:+$('#f-size').value||null,
    stop:+$('#f-stop').value||null, target:+$('#f-target').value||null,
    pnl, rr:$('#f-rr').value?+$('#f-rr').value:null, emotion:$('#f-emotion').value,
    rulesFollowed:followed, rulesTotal:rules.length, notes:$('#f-notes').value.trim() };
  const arr=Store.getTrades(); arr.push(t); Store.saveTrades(arr);
  const p=Store.getProfile(); p.xp=(p.xp||0)+10+(followed===rules.length&&rules.length?5:0); Store.saveProfile(p);
  toast('Trade logged · +'+(10+(followed===rules.length&&rules.length?5:0))+' XP','good');
  go('dash');
}
function delTrade(id){ let a=Store.getTrades(); a=a.filter(t=>t.id!==id); Store.saveTrades(a); toast('Trade deleted'); VIEWS[current](); }
function addRule(){ const i=$('#newRule'); const val=i.value.trim(); if(!val)return; const r=Store.getRules(); r.push(val); Store.saveRules(r); VIEWS.playbook(); toast('Rule added','good'); }
function disciplineStreak(){ const tr=Store.getTrades(); let s=0; for(let i=tr.length-1;i>=0;i--){ if(tr[i].rulesTotal>0&&tr[i].rulesFollowed===tr[i].rulesTotal) s++; else break; } return s; }

/* ---------------- render helpers ---------------- */
function kpi(label,val,cls,sub){ return `<div class="card"><div class="klabel">${label}</div><div class="kval ${cls}">${val}</div><div class="ksub">${sub}</div></div>`; }
function emptyState(h,p,goId,btn){ return `<div class="card"><div class="empty"><div class="ei"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg></div><h3>${h}</h3><p style="max-width:38ch;margin:0 auto 18px">${p}</p><button class="btn btn-primary" onclick="go('${goId}')">${btn}</button></div></div>`; }
function tradeTable(tr,withDelete){
  if(!tr.length) return '<div class="hint" style="padding:10px 2px">No trades.</div>';
  return `<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Date</th><th>Symbol</th><th>Side</th><th>R:R</th><th>Rules</th><th style="text-align:right">P&L</th>${withDelete?'<th></th>':''}</tr></thead><tbody>${
    tr.map(t=>`<tr><td class="mono">${fmtDate(t.date)}</td><td style="font-weight:600">${t.symbol}</td><td><span class="pill ${t.side}">${t.side}</span></td><td class="mono">${t.rr?t.rr.toFixed(2):'–'}</td><td class="mono">${t.rulesTotal?t.rulesFollowed+'/'+t.rulesTotal:'–'}</td><td style="text-align:right;font-weight:700" class="${t.pnl>=0?'pos':'neg'}">${money(t.pnl)}</td>${withDelete?`<td style="text-align:right"><button class="del-x" onclick="delTrade(${t.id})" aria-label="Delete"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button></td>`:''}</tr>`).join('')
  }</tbody></table></div>`;
}
function equitySVG(tr){
  const pts=[]; let cum=0; tr.forEach(t=>{cum+=t.pnl;pts.push(cum);});
  if(pts.length<2){ return `<div class="hint" style="padding:20px 0">Log at least 2 trades to draw your equity curve. Current: ${money(cum)}</div>`; }
  const min=Math.min(0,...pts), max=Math.max(0,...pts), range=(max-min)||1;
  const W=500,H=150;
  const path=pts.map((p,i)=>`${i?'L':'M'}${(i/(pts.length-1)*W).toFixed(1)},${(H-(p-min)/range*H).toFixed(1)}`).join(' ');
  const area=path+` L${W},${H} L0,${H} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="150" preserveAspectRatio="none"><defs><linearGradient id="ef" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(124,92,252,0.35)"/><stop offset="100%" stop-color="rgba(124,92,252,0)"/></linearGradient><linearGradient id="el" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7C5CFC"/><stop offset="100%" stop-color="#E15CC6"/></linearGradient></defs><path d="${area}" fill="url(#ef)"/><path d="${path}" fill="none" stroke="url(#el)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function ring(pct){
  const r=42,c=2*Math.PI*r,off=c-(pct/100)*c;
  return `<div class="ring-wrap"><svg width="150" height="150" viewBox="0 0 100 100"><circle cx="50" cy="50" r="${r}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="10"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="url(#el2)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 50 50)"/><defs><linearGradient id="el2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7C5CFC"/><stop offset="100%" stop-color="#E15CC6"/></linearGradient></defs></svg><div class="ring-num"><div><div class="n grad-text">${pct}</div><div class="hint">of 100</div></div></div></div>`;
}

/* ---------------- init ---------------- */
$('#uName').textContent=session.name||'Trader';
$('#uEmail').textContent=session.email;
$('#uAvatar').textContent=(session.name||session.email||'T').trim()[0].toUpperCase();
$('#logoutBtn').onclick=()=>Store.logout();
buildNav(); go('dash');
</script>
