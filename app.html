<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='1' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='%237C5CFC'/%3E%3Cstop offset='1' stop-color='%23E15CC6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Crect x='7' y='17' width='4.4' height='8' rx='2' fill='white'/%3E%3Crect x='13.8' y='12' width='4.4' height='13' rx='2' fill='white'/%3E%3Crect x='20.6' y='7' width='4.4' height='18' rx='2' fill='white'/%3E%3C/svg%3E" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0A0A16" />
<link rel="apple-touch-icon" href="/icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="EDGE Pro" />
<title>EDGE Pro — Journal</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    color-scheme:dark;
    --bg:#0A0A16; --bg-2:#0E0E20; --surface:#12122A; --surface-2:#16162E; --card:rgba(255,255,255,0.02);
    --border:rgba(255,255,255,0.07); --border-2:rgba(255,255,255,0.13);
    --text:#F4F4FB; --muted:rgba(244,244,251,0.68); --faint:rgba(244,244,251,0.50);
    --violet:#7C5CFC; --violet-2:#9D7BFF; --pink:#E15CC6;
    --grad:linear-gradient(135deg,#7C5CFC 0%,#A45CFC 45%,#E15CC6 100%);
    --win:#24D19B; --loss:#F5476B; --gold:#FFC43D; --blue:#6AA9FF; --track:rgba(255,255,255,0.08);
    --ease:cubic-bezier(0.16,1,0.3,1);
  }
  *{box-sizing:border-box;min-width:0;}
  html,body{margin:0;padding:0;min-height:100%;max-width:100%;overflow-x:hidden;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;letter-spacing:-0.011em;-webkit-font-smoothing:antialiased;overflow-wrap:break-word;}
  h1,h2,h3{font-family:'Space Grotesk','Inter',sans-serif;letter-spacing:-0.02em;margin:0;}
  a{color:inherit;text-decoration:none;}
  .mono{font-family:'JetBrains Mono',monospace;}
  ::-webkit-scrollbar{width:9px;height:9px;} ::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:6px;}

  .shell{display:grid;grid-template-columns:236px 1fr;gap:16px;padding:16px;min-height:100dvh;}
  @media(max-width:900px){ .shell{grid-template-columns:1fr;} .sidebar{position:fixed;left:-260px;top:0;bottom:0;z-index:60;transition:left .25s var(--ease);} .sidebar.open{left:0;} .hamb{display:grid!important;} .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:55;} .scrim.on{display:block;} }

  /* sidebar */
  .sidebar{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.09);border-radius:22px;display:flex;flex-direction:column;padding:20px 14px;height:calc(100dvh - 32px);position:sticky;top:16px;overflow-y:auto;-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);box-shadow:0 24px 60px -30px rgba(0,0,0,.7);}
  [data-theme="light"] .sidebar{background:rgba(255,255,255,0.72);border-color:rgba(18,20,45,0.10);}
  .brand{display:flex;align-items:center;gap:6px;font-family:'Space Grotesk';font-weight:700;font-size:21px;padding:4px 8px 22px;}
  .brand .p{color:var(--violet-2);}
  .nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:500;font-size:14px;cursor:pointer;border:none;background:transparent;width:100%;text-align:left;transition:background .16s var(--ease),color .16s var(--ease);}
  .nav-item svg{width:17px;height:17px;flex:none;opacity:.85;}
  .nav-item:hover{background:rgba(255,255,255,0.04);color:var(--text);}
  .nav-item.active{background:rgba(124,92,252,0.16);color:var(--violet-2);font-weight:600;}
  .side-xp{margin-top:14px;padding:12px;border:1px solid var(--border);border-radius:12px;}
  .side-xp .row{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.06em;color:var(--faint);font-weight:600;text-transform:uppercase;}
  .xp-track{height:6px;border-radius:5px;background:rgba(255,255,255,0.08);margin-top:9px;overflow:hidden;} .xp-fill{height:100%;background:var(--grad);border-radius:5px;transition:width .7s var(--ease);}
  .trial{margin-top:12px;padding:14px;border-radius:13px;background:radial-gradient(120% 100% at 0 0,rgba(124,92,252,0.18),transparent 70%),var(--surface);border:1px solid var(--border);}
  .trial p{font-size:12.5px;color:var(--muted);margin:0 0 10px;}
  .trial b{color:var(--text);}

  /* main */
  main{min-width:0;display:flex;flex-direction:column;}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(10,10,22,0.82);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 28px;}
  .topbar h1{font-size:23px;}
  .topbar .sub{font-size:12.5px;color:var(--faint);margin-top:3px;}
  .top-right{display:flex;align-items:center;gap:12px;}
  .sess-pill{display:none;align-items:center;gap:8px;font-size:14px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:10px 18px;}
  .sess-pill b{font-size:16px;}
  @media(min-width:680px){ .sess-pill{display:inline-flex;} }
  .sess-pill b{color:var(--violet-2);font-family:'JetBrains Mono';}
  .cmdbar{display:none;align-items:center;gap:3px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.09);border-radius:999px;padding:5px;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 10px 30px -14px rgba(0,0,0,.6);}
  [data-theme="light"] .cmdbar{background:rgba(255,255,255,0.7);border-color:rgba(18,20,45,0.1);}
  @media(min-width:1080px){.cmdbar{display:inline-flex;}}
  .cmd-btn{width:38px;height:38px;border-radius:999px;border:none;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:background .18s var(--ease),color .18s var(--ease),transform .18s var(--ease);}
  .cmd-btn svg{width:18px;height:18px;}
  .cmd-btn:hover{background:rgba(124,92,252,0.15);color:var(--violet-2);transform:translateY(-1px);}
  .cmd-btn.primary{background:var(--grad);color:#fff;box-shadow:0 6px 18px -6px rgba(124,92,252,.7);}
  .cmd-btn.primary:hover{filter:brightness(1.08);transform:translateY(-1px) scale(1.04);}
  .cmd-div{width:1px;height:20px;background:var(--border);margin:0 3px;}
  .kcard:hover,#view>.card:hover,.two-col>.card:hover{box-shadow:0 16px 46px -18px rgba(124,92,252,.34);border-color:rgba(124,92,252,0.22);}
  .icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,0.04);color:var(--muted);display:grid;place-items:center;cursor:pointer;}
  .icon-btn:hover{color:var(--text);}
  .hamb{display:none;}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-weight:700;font-size:15px;cursor:pointer;}
  .content{padding:26px 28px 60px;max-width:1280px;width:100%;}
  @media(max-width:900px){ .content,.topbar{padding-left:16px;padding-right:16px;} }

  /* buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:11px;font-weight:600;font-size:14px;cursor:pointer;border:1px solid transparent;transition:transform .16s var(--ease),box-shadow .2s,background .2s;font-family:inherit;}
  .btn-primary{background:var(--grad);color:#fff;box-shadow:0 8px 22px rgba(124,92,252,0.4);}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(124,92,252,0.55);}
  .btn-ghost{background:rgba(255,255,255,0.05);border-color:var(--border-2);color:var(--text);}
  .btn-ghost:hover{background:rgba(255,255,255,0.1);}
  .btn-danger{background:rgba(245,71,107,0.14);border-color:rgba(245,71,107,0.3);color:var(--loss);}
  .btn-sm{height:36px;padding:0 14px;font-size:13px;}
  .btn-full{width:100%;}

  /* cards + grid */
  .grid{display:grid;gap:20px;}
  .kpis{grid-template-columns:repeat(2,1fr);}
  @media(min-width:760px){ .kpis{grid-template-columns:repeat(4,1fr);} }
  .card{background:linear-gradient(180deg,var(--surface),var(--bg-2));border:1px solid var(--border);border-radius:18px;padding:26px;}
  .kcard{position:relative;}
  .season-pill{margin-left:8px;display:inline-flex;align-items:center;gap:5px;font-family:'Space Grotesk';font-size:11px;font-weight:600;letter-spacing:.02em;color:#fff;padding:4px 10px;border-radius:999px;background:var(--grad);box-shadow:0 4px 14px -4px var(--season-tint,rgba(124,92,252,.5)),inset 0 1px 0 rgba(255,255,255,.28);white-space:nowrap;animation:seasonPop .5s var(--ease) both;}
  @keyframes seasonPop{from{opacity:0;transform:translateY(-4px) scale(.9)}to{opacity:1;transform:none}}
  body.season-active .card{border-color:var(--season-tint,var(--border));}
  body.season-active .topbar{border-bottom-color:var(--season-tint,var(--border));}
  @media(max-width:640px){ .season-pill{display:none;} }
  .klabel{font-family:'JetBrains Mono';font-size:12px;text-transform:uppercase;letter-spacing:0.09em;color:var(--faint);font-weight:500;}
  .kval{font-family:'JetBrains Mono';font-weight:700;font-size:42px;margin-top:14px;letter-spacing:-.02em;line-height:1;}
  .kval.win{color:var(--win);} .kval.loss{color:var(--loss);} .kval.violet{color:var(--violet-2);}
  .ksub{font-size:13px;color:var(--faint);margin-top:10px;}
  .badge{position:absolute;top:18px;right:18px;font-family:'JetBrains Mono';font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:.05em;}
  .badge.good{background:rgba(36,209,155,0.14);color:var(--win);border:1px solid rgba(36,209,155,0.3);}
  .grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .card-title{font-size:20px;font-weight:600;} .card-sub{font-size:12.5px;color:var(--faint);margin-top:2px;}
  .row-sb{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .two-col{display:grid;gap:16px;grid-template-columns:1fr;} @media(min-width:960px){ .two-col{grid-template-columns:1.5fr 1fr;} }
  .section-gap{margin-top:16px;}
  .chip{font-family:'JetBrains Mono';font-size:11px;padding:3px 9px;border-radius:6px;border:1px solid var(--border-2);color:var(--violet-2);}
  .pct-pill{font-family:'JetBrains Mono';font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px;background:rgba(36,209,155,0.14);color:var(--win);}
  .pct-pill.neg{background:rgba(245,71,107,0.14);color:var(--loss);}

  /* discipline breakdown */
  .dbrk{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
  .dbrk:last-child{border-bottom:none;}
  .dbrk .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:9px;}
  .ring-wrap{position:relative;width:176px;height:176px;flex:0 0 auto;}
  .ring-fg{filter:drop-shadow(0 0 5px rgba(124,92,252,.55));}
  svg .eq-dot{opacity:0;} svg rect:hover + .eq-dot{opacity:1!important;}
  .ring-num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;}
  .ring-num .n{font-family:'JetBrains Mono';font-weight:700;font-size:32px;color:var(--violet-2);}
  .ring-num .o{font-family:'JetBrains Mono';font-size:10px;color:var(--faint);letter-spacing:.1em;}

  /* table */
  .tbl{width:100%;border-collapse:collapse;font-size:13.5px;}
  .tbl th{text-align:left;font-family:'JetBrains Mono';font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--border);}
  .tbl td{padding:12px;border-bottom:1px solid var(--border);}
  .tbl tr:last-child td{border-bottom:none;}
  .tbl tr:hover td{background:rgba(255,255,255,0.02);}
  .row-ai{color:var(--violet-2)!important;border-color:var(--border-2)!important;} .row-ai:hover{border-color:var(--violet-2)!important;background:rgba(124,92,252,.1)!important;}
  .tag{display:inline-flex;padding:3px 9px;border-radius:6px;font-size:11.5px;font-weight:600;font-family:'JetBrains Mono';}
  .tag.long{background:rgba(36,209,155,0.14);color:var(--win);} .tag.short{background:rgba(245,71,107,0.14);color:var(--loss);}
  .pos{color:var(--win);} .neg{color:var(--loss);}
  .del-x{background:transparent;border:none;color:var(--faint);cursor:pointer;padding:8px;min-width:34px;min-height:34px;border-radius:6px;} .del-x:hover{color:var(--loss);background:rgba(245,71,107,0.12);}
  button,a,.tab,.chip-tag,.seg-btn,.rule,.del-x,.icon-btn{touch-action:manipulation;}
  @media(max-width:560px){ .btn-sm{height:40px;} .chip-tag{padding:10px 14px;} .icon-btn{min-width:40px;min-height:40px;} }

  /* forms */
  .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;} @media(min-width:640px){ .form-grid{grid-template-columns:repeat(3,1fr);} }
  .fgrp{display:flex;flex-direction:column;gap:6px;} .fgrp.full{grid-column:1/-1;}
  .flbl{font-size:12px;color:var(--muted);font-weight:500;}
  .finp{height:44px;border-radius:10px;border:1px solid var(--border-2);background:rgba(255,255,255,0.04);color:var(--text);padding:0 13px;font-size:14px;font-family:inherit;}
  textarea.finp{height:auto;min-height:80px;padding:11px 13px;resize:vertical;}
  select.finp{cursor:pointer;} .finp:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,92,252,0.18);}

  /* checklist / rules */
  .rule{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--border);border-radius:11px;margin-bottom:8px;cursor:pointer;transition:.2s;}
  .rule:hover{border-color:var(--border-2);} .rule.on{border-color:rgba(36,209,155,0.5);background:rgba(36,209,155,0.1);box-shadow:0 0 0 1px rgba(36,209,155,.35),0 8px 22px -8px rgba(36,209,155,.55);animation:ruleGlow .34s var(--ease);}
  @keyframes ruleGlow{0%{transform:scale(.985)}55%{transform:scale(1.02)}100%{transform:scale(1)}}
  .rule .box{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--border-2);display:grid;place-items:center;flex:none;color:transparent;} .rule.on .box{background:var(--win);border-color:var(--win);color:#04120c;}
  .chip-list{display:flex;flex-wrap:wrap;gap:8px;}
  .rule-chip{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:rgba(124,92,252,0.1);border:1px solid rgba(124,92,252,0.3);font-size:13px;}
  .rule-chip button{background:none;border:none;color:var(--faint);cursor:pointer;font-size:15px;}
  .rule-chip button:hover{color:var(--loss);}

  /* meters */
  .meter{margin:14px 0;} .meter .mrow{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px;} .meter .mrow b{font-family:'JetBrains Mono';}
  .mtrack{height:8px;border-radius:6px;background:rgba(255,255,255,0.07);overflow:hidden;} .mfill{height:100%;border-radius:6px;background:var(--grad);box-shadow:inset 0 1px 0 rgba(255,255,255,0.28);}
  .mfill.win{background:linear-gradient(90deg,var(--win),#5fe0b8);} .mfill.loss{background:linear-gradient(90deg,var(--loss),#ff7a94);}

  /* achievements */
  .ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;}
  .ach{padding:16px;border-radius:13px;border:1px solid var(--border);background:var(--card);text-align:center;opacity:.42;transition:.25s;}
  .ach.on{opacity:1;border-color:rgba(255,196,61,0.35);background:rgba(255,196,61,0.06);}
  .ach .ic{font-size:24px;margin-bottom:8px;} .ach .an{font-size:13px;font-weight:600;} .ach .ad{font-size:11px;color:var(--faint);margin-top:3px;}

  /* calendar */
  .cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;} .cal-dow span{text-align:center;font-size:10.5px;color:var(--faint);font-weight:600;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-day{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;border:1px solid var(--border);background:var(--card);color:var(--faint);}
  .cal-day .pl{font-weight:700;font-size:10px;} .cal-day.win{background:rgba(36,209,155,0.14);border-color:rgba(36,209,155,0.32);} .cal-day.win .pl{color:var(--win);}
  .cal-day.loss{background:rgba(245,71,107,0.13);border-color:rgba(245,71,107,0.3);} .cal-day.loss .pl{color:var(--loss);}
  .cal-day.slip{background:rgba(255,196,61,0.13);border-color:rgba(255,196,61,0.34);} .cal-day.slip .pl{color:var(--gold);}

  .empty{text-align:center;padding:48px 20px;color:var(--muted);} .empty .ei{width:56px;height:56px;border-radius:15px;background:rgba(124,92,252,0.12);border:1px solid rgba(124,92,252,0.28);display:grid;place-items:center;margin:0 auto 14px;color:var(--violet-2);} .empty h3{font-size:17px;margin-bottom:6px;}
  .hint{font-size:12px;color:var(--faint);}
  .insight{display:flex;gap:11px;align-items:flex-start;padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--card);font-size:14px;line-height:1.5;}
  .insight .ci{width:24px;height:24px;border-radius:7px;flex:none;display:grid;place-items:center;background:rgba(36,209,155,0.14);color:var(--win);}

  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(5,5,12,0.7);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:80;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;}
  .modal-bg.show{display:flex;}
  .modal{background:linear-gradient(180deg,var(--surface),var(--bg-2));border:1px solid var(--border-2);border-radius:18px;padding:24px;max-width:760px;width:100%;box-shadow:0 40px 100px rgba(0,0,0,0.6);}
  .modal-x{background:transparent;border:none;color:var(--faint);cursor:pointer;font-size:22px;line-height:1;}
  .cmdk-bg{position:fixed;inset:0;background:rgba(5,5,12,0.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:120;display:none;align-items:flex-start;justify-content:center;padding:14vh 16px 16px;}
  .cmdk-bg.show{display:flex;}
  .cmdk{background:linear-gradient(180deg,var(--surface),var(--bg-2));border:1px solid var(--border-2);border-radius:16px;width:100%;max-width:560px;box-shadow:0 40px 100px rgba(0,0,0,0.6);overflow:hidden;animation:popIn .16s var(--ease);}
  #cmdInput{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);font-size:17px;padding:18px 20px;outline:none;font-family:inherit;}
  .cmd-list{max-height:44vh;overflow-y:auto;padding:8px;}
  .cmd-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;cursor:pointer;font-size:14.5px;color:var(--text);}
  .cmd-row.sel{background:var(--violet);color:#fff;}
  .cmd-ic{flex:0 0 auto;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--surface-2);color:var(--violet-2);font-size:13px;}
  .cmd-row.sel .cmd-ic{background:rgba(255,255,255,.2);color:#fff;}
  .cmd-empty{padding:22px;text-align:center;color:var(--muted);font-size:14px;}
  .cmd-foot{display:flex;gap:16px;padding:10px 16px;border-top:1px solid var(--border);color:var(--faint);font-size:11.5px;}
  .tour-overlay{position:fixed;inset:0;background:rgba(5,5,12,.55);-webkit-backdrop-filter:blur(1px);backdrop-filter:blur(1px);z-index:200;}

/* ===== Motion layer ===== */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes ringIn{from{stroke-dashoffset:264}}
#view.anim>*{animation:fadeUp .5s var(--ease) both}

#view.anim>*:nth-child(4){animation-delay:.18s} #view.anim>*:nth-child(5){animation-delay:.24s}
#view.anim>*:nth-child(6){animation-delay:.30s} #view.anim>*:nth-child(7){animation-delay:.36s}

#view.anim .eqline{stroke-dasharray:1600;stroke-dashoffset:1600;animation:draw 1.4s var(--ease) .25s forwards}
#view.anim .ring-fg{animation:ringIn 1.1s var(--ease) .3s both}

.btn-primary:hover{filter:brightness(1.04)}

.nav-item.active::before{content:"";position:absolute;left:2px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--grad);animation:popIn .3s var(--ease)}
.menu.open{animation:popIn .18s var(--ease)}
.modal{animation:fadeUp .3s var(--ease)}
.rule,.ach,.tag{transition:transform .18s var(--ease),border-color .2s,background .2s}

tr{transition:background .15s}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}

/* ============ in-browser backend (localStorage). Swap for real API/Supabase later. ============ */
const Store={
  session(){ if(window.__DEMO) return {email:'demo-sample',name:'Demo Trader',demo:true}; try{return JSON.parse(localStorage.getItem('edgepro_session'));}catch{return null;} },
  logout(){ if(window.__DEMO){ location.href='login.html'; return; } try{ if(window.SB) window.SB.auth.signOut(); }catch(e){} localStorage.removeItem('edgepro_session'); location.href='login.html'; },
  k(b){ const s=this.session(); return `edgepro_${b}_${s?s.email:'anon'}`; },
  get(b,d){ try{return JSON.parse(localStorage.getItem(this.k(b)))??d;}catch{return d;} },
  set(b,v){ try{ localStorage.setItem(this.k(b),JSON.stringify(v)); if(typeof cloudPush==='function')cloudPush(); return true; }catch(e){ toast('Storage full — export & reset, or use fewer screenshots','bad'); return false; } },
  trades(){ return this.get('trades',[]); }, saveTrades(t){ this.set('trades',t); },
  playbooks(){ let p=this.get('playbooks',null); if(!p){ p=[{name:'A+ Setup',rules:['Setup matches my playbook','Stop loss set before entry','Risk ≤ 1% of account','Not revenge trading','Within my session hours']}]; this.set('playbooks',p);} return p; },
  savePlaybooks(p){ this.set('playbooks',p); },
  journal(){ return this.get('journal',[]); }, saveJournal(j){ this.set('journal',j); },
  goals(){ return this.get('goals',[]); }, saveGoals(g){ this.set('goals',g); },
  evals(){ let a=this.get('evals',null); if(!a||!a.length){ const o=this.get('eval',{firm:'FTMO Challenge',size:10000,phase:'Phase 1',target:1000,dailyLoss:500,maxDD:1000}); a=[Object.assign({id:'ch'+Math.random().toString(36).slice(2,8)},o)]; this.set('evals',a); } return a; },
  saveEvals(a){ this.set('evals',a); },
  activeEval(){ const a=this.evals(); return a.find(c=>c.id===this.get('evalActive',null))||a[0]; },
  setActiveEval(id){ this.set('evalActive',id); },
  evalCfg(){ return this.evals()[0]; }, saveEval(e){ const a=this.evals(); a[0]=Object.assign(a[0],e); this.set('evals',a); },
  settings(){ return this.get('settings',{account:10000,name:(this.session()||{}).name||'Trader'}); }, saveSettings(s){ this.set('settings',s); },
  profile(){ return this.get('profile',{xp:0}); }, saveProfile(p){ this.set('profile',p); },
};
const _CFG=window.EDGE_CONFIG||{}; window.SB=(_CFG.supabase&&_CFG.supabase.url&&_CFG.supabase.anonKey&&window.supabase)?window.supabase.createClient(_CFG.supabase.url,_CFG.supabase.anonKey):null;
window.__DEMO=(new URLSearchParams(location.search).get('demo')==='1');
const session=Store.session(); if(!session) location.href='login.html';
const $=(s,r=document)=>r.querySelector(s);
const money=n=>(n<0?'-':'+')+'$'+Math.abs(Math.round(n)).toLocaleString();
const money0=n=>'$'+Math.round(n).toLocaleString();
const fmtDate=d=>new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric'});
function toast(m,k=''){ const t=$('#toast'); t.textContent=m; t.className='show '+k; setTimeout(()=>t.className='',2600); }
let _undoTimer=null;
function toastUndo(m,undoFn){ const t=$('#toast'); t.innerHTML=''; const span=document.createElement('span'); span.textContent=m+'  '; const btn=document.createElement('button'); btn.textContent='Undo'; btn.style.cssText='background:none;border:none;color:var(--violet-2);font-weight:700;cursor:pointer;font-size:14px;padding:0'; btn.onclick=()=>{ clearTimeout(_undoTimer); t.className=''; t.textContent=''; undoFn(); }; t.appendChild(span); t.appendChild(btn); t.className='show'; clearTimeout(_undoTimer); _undoTimer=setTimeout(()=>{ t.className=''; t.textContent=''; },6000); }
function toggleNav(o){ const s=$('#sidebar'); if(s)s.classList.toggle('open',o); const sc=$('#scrim'); if(sc)sc.classList.toggle('on',o); }

function stats(trArg){
  const tr=(trArg||Store.trades()).filter(t=>!t.open); const acct=Store.settings().account||10000;
  const wins=tr.filter(t=>t.pnl>0), losses=tr.filter(t=>t.pnl<0);
  const gw=wins.reduce((a,t)=>a+t.pnl,0), gl=Math.abs(losses.reduce((a,t)=>a+t.pnl,0));
  const net=tr.reduce((a,t)=>a+t.pnl,0);
  const wr=tr.length?Math.round(wins.length/tr.length*100):0;
  const pf=gl?(gw/gl):(gw?Infinity:0);
  const exp=tr.length?net/tr.length:0;
  const rrArr=tr.filter(t=>t.rr); const avgRR=rrArr.length?rrArr.reduce((a,t)=>a+t.rr,0)/rrArr.length:null;
  const avgWin=wins.length?gw/wins.length:0, avgLoss=losses.length?gl/losses.length:0;
  const tiltArr=tr.filter(t=>t.tilt!=null); const tilt=tiltArr.length?tiltArr.reduce((a,t)=>a+t.tilt,0)/tiltArr.length:null;
  const disTr=tr.filter(t=>t.rulesTotal>0); const dis=disTr.length?Math.round(disTr.reduce((a,t)=>a+t.rulesFollowed/t.rulesTotal,0)/disTr.length*100):100;
  const broken=disTr.reduce((a,t)=>a+(t.rulesFollowed<t.rulesTotal?1:0),0);
  const rulesFollowed=disTr.filter(t=>t.rulesFollowed===t.rulesTotal).length;
  const slips=tr.filter(t=>t.pnl>0&&t.rulesTotal>0&&t.rulesFollowed<t.rulesTotal).length;
  // max drawdown — peak-to-trough on equity, in chronological order (precise)
  const chron=tr.slice().sort((a,b)=>((a.date||'')+'').localeCompare((b.date||'')+''));
  let peak=acct, eqRun=acct, mdd=0; chron.forEach(t=>{ eqRun+=t.pnl; if(eqRun>peak)peak=eqRun; const d=peak-eqRun; if(d>mdd)mdd=d; });
  const maxDD=Math.round(mdd), maxDDpct=acct?mdd/acct*100:0;
  // realized R-multiples where risk is actually defined (entry, stop, size) — the honest number
  const rTr=tr.filter(t=>t.entry!=null&&t.stop!=null&&t.size&&Math.abs(t.entry-t.stop)>0);
  const rMults=rTr.map(t=>{ const risk=Math.abs(t.entry-t.stop)*Math.abs(t.size); return risk?t.pnl/risk:0; });
  const avgR=rMults.length?rMults.reduce((a,b)=>a+b,0)/rMults.length:null;
  const rCount=rMults.length;
  const recovery=mdd>0?(net/mdd):(net>0?Infinity:0);
  return {tr,acct,wins:wins.length,losses:losses.length,net,wr,pf,exp,avgRR,avgWin,avgLoss,tilt,dis,broken,rulesFollowed,slips,maxDD,maxDDpct,avgR,rCount,recovery};
}
/* ---- EDGE Scores — proprietary performance metrics, computed only from the trader's own data (never fabricated) ---- */
function _edgeRaw(list){
  const clamp=x=>Math.max(0,Math.min(100,Math.round(x)));
  const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
  const std=a=>{ if(a.length<2)return 0; const m=mean(a); return Math.sqrt(mean(a.map(x=>(x-m)*(x-m)))); };
  const chron=list.slice(); const n=chron.length;
  const graded=chron.filter(t=>t.rulesTotal>0);
  const risk=t=>(t.entry!=null&&t.stop!=null&&t.size&&Math.abs(t.entry-t.stop)>0)?Math.abs(t.entry-t.stop)*Math.abs(t.size):null;
  const rOf=t=>{ const rk=risk(t); return rk?t.pnl/rk:null; };

  const discipline = graded.length ? clamp(mean(graded.map(t=>t.rulesFollowed/t.rulesTotal))*100) : null;
  const ruleAdh = graded.length>=3 ? clamp(graded.filter(t=>t.rulesFollowed>=t.rulesTotal).length/graded.length*100) : null;

  let consistency=null;
  if(n>=5){
    const risks=chron.map(risk).filter(x=>x!=null&&x>0);
    let sizeScore=null;
    if(risks.length>=5){ const cv=std(risks)/(mean(risks)||1); sizeScore=clamp(100-cv*90); }
    const rs=chron.map(rOf).filter(x=>x!=null);
    const series=rs.length>=5?rs:chron.map(t=>t.pnl);
    const base=Math.abs(mean(series.map(Math.abs)))||1;
    const outScore=clamp(100-(std(series)/base)*45);
    consistency = sizeScore!=null ? clamp(sizeScore*0.55+outScore*0.45) : outScore;
  }

  let execution=null;
  const rTr=chron.map(t=>rOf(t)).filter(x=>x!=null);
  if(rTr.length>=5){
    const blown=rTr.filter(r=>r<-1.15).length/rTr.length;
    const avgR=mean(rTr);
    execution=clamp(clamp(55+avgR*35)*(1-blown*0.6));
  } else if(n>=6){
    const gw=chron.filter(t=>t.pnl>0).reduce((a,t)=>a+t.pnl,0);
    const gl=Math.abs(chron.filter(t=>t.pnl<0).reduce((a,t)=>a+t.pnl,0));
    const pf=gl?gw/gl:(gw?3:0);
    execution=clamp(38+Math.min(pf,3)*18);
  }

  let emotional=null; { const parts=[];
    const tiltArr=chron.filter(t=>t.tilt!=null).map(t=>t.tilt);
    if(tiltArr.length>=4) parts.push(clamp(100-(mean(tiltArr)/5)*100));
    if(n>=8){
      const wrAll=chron.filter(t=>t.pnl>0).length/n;
      let alW=0,alN=0; for(let i=1;i<chron.length;i++){ if(chron[i-1].pnl<0){ alN++; if(chron[i].pnl>0)alW++; } }
      if(alN>=3){ const ratio=wrAll>0?(alW/alN)/wrAll:1; parts.push(clamp(60+(ratio-1)*80)); }
    }
    if(parts.length) emotional=clamp(mean(parts));
  }

  let confidence=null;
  if(n>=6){
    let aL=[],aW=[]; for(let i=1;i<chron.length;i++){ const rk=risk(chron[i]); if(rk==null)continue; if(chron[i-1].pnl<0)aL.push(rk); else if(chron[i-1].pnl>0)aW.push(rk); }
    if(aL.length>=2&&aW.length>=2){ const ratio=mean(aL)/(mean(aW)||1); confidence=clamp(100-Math.abs(Math.log(ratio||1))*70); }
    else if(ruleAdh!=null){ confidence=clamp(ruleAdh*0.6+(chron.filter(t=>t.pnl>0).length/n*100)*0.4); }
  }

  let decision=null;

/* ---- Behavioral leak engine — spots recurring mistakes from real trades, quantifies the $ cost, prescribes a fix ---- */
function behavioralLeaks(listArg){
  const tr=(listArg||Store.trades()).filter(t=>!t.open).slice().sort((a,b)=>{ const d=((a.date||'')+'').localeCompare((b.date||'')+''); return d||((a.id||0)-(b.id||0)); });
  const n=tr.length; if(n<6) return [];
  const m0=v=>'$'+Math.round(Math.abs(v)).toLocaleString();
  const risk=t=>(t.entry!=null&&t.stop!=null&&t.size&&Math.abs(t.entry-t.stop)>0)?Math.abs(t.entry-t.stop)*Math.abs(t.size):null;
  const median=a=>{ if(!a.length)return 0; const b=a.slice().sort((x,y)=>x-y); const i=Math.floor(b.length/2); return b.length%2?b[i]:(b[i-1]+b[i])/2; };
  const out=[]; const base=tr.filter(t=>t.pnl>0).length/n;

  // Revenge trading — after-loss trades that keep losing
  const afterLoss=tr.filter((t,i)=>i>0&&tr[i-1].pnl<0);
  if(afterLoss.length>=4){ const alWR=afterLoss.filter(t=>t.pnl>0).length/afterLoss.length;
    const revCost=afterLoss.filter(t=>t.pnl<0).reduce((a,t)=>a+t.pnl,0);
    if(alWR<base-0.08&&revCost<0) out.push({title:'Revenge trading',cost:revCost,detail:'After a loss you win just <b>'+Math.round(alWR*100)+'%</b> vs <b>'+Math.round(base*100)+'%</b> normally — those trades have cost you '+m0(revCost)+'.',fix:'Step away for 10 minutes after any red trade before taking the next one.'});
  }
  // Overtrading — busiest days perform worst
  const byDay={}; tr.forEach(t=>{ const d=(t.date||'').slice(0,10)||'x'; (byDay[d]=byDay[d]||[]).push(t); });
  const days=Object.values(byDay);
  if(days.length>=5){ const counts=days.map(d=>d.length); const med=median(counts); const thr=Math.max(4,med+2);
    const heavy=days.filter(d=>d.length>=thr).flat(), normal=days.filter(d=>d.length<thr).flat();
    if(heavy.length>=3&&normal.length>=1){ const hAvg=heavy.reduce((a,t)=>a+t.pnl,0)/heavy.length, nAvg=normal.reduce((a,t)=>a+t.pnl,0)/normal.length;
      if(hAvg<nAvg&&hAvg<0) out.push({title:'Overtrading',cost:heavy.reduce((a,t)=>a+t.pnl,0),detail:'On your busiest days you average <b>'+(hAvg>=0?'+':'-')+m0(hAvg)+'</b> per trade vs <b>'+(nAvg>=0?'+':'-')+m0(nAvg)+'</b> normally. More trades, worse results.',fix:'Set a max number of trades per day and stop the moment you hit it.'});
    }
  }
  // Oversizing — risk outliers in the red
  const risks=tr.map(t=>({t,rk:risk(t)})).filter(o=>o.rk!=null&&o.rk>0);
  if(risks.length>=6){ const med=median(risks.map(o=>o.rk)); const big=risks.filter(o=>o.rk>med*1.8);
    if(big.length>=2){ const cost=big.reduce((a,o)=>a+o.t.pnl,0); if(cost<0) out.push({title:'Oversizing',cost:cost,detail:'<b>'+big.length+'</b> trades were sized well above your normal risk — together they\'re '+m0(cost)+' in the red. Big bets aren\'t your edge.',fix:'Risk the same fixed % on every trade, no exceptions.'}); }
  }
  // Letting losers run — losses past the planned stop
  const rr=tr.map(t=>{ const rk=risk(t); return rk?{t,r:t.pnl/rk,rk}:null; }).filter(Boolean);
  if(rr.length>=6){ const blown=rr.filter(o=>o.r<-1.2);
    if(blown.length>=2){ const extra=blown.reduce((a,o)=>a+(o.t.pnl+o.rk),0); if(extra<0) out.push({title:'Letting losers run',cost:extra,detail:'<b>'+blown.length+'</b> losses blew through your planned stop — that overflow alone cost '+m0(extra)+'. A stop you move isn\'t a stop.',fix:'Set your stop before entry and never widen it.'}); }
  }
  // Cutting winners early
  const cut=tr.filter(t=>t.pnl>0&&t.rr&&t.rr>=1.5).filter(t=>{ const rk=risk(t); return rk?(t.pnl/rk)<t.rr*0.5:false; });
  if(cut.length>=3) out.push({title:'Cutting winners early',cost:0,detail:'<b>'+cut.length+'</b> winners were closed below half their planned target — you\'re leaving profit on the table.',fix:'Hold to your target or trail your stop; let winners pay for the losers.'});
  // Rule-breaking cost
  const graded=tr.filter(t=>t.rulesTotal>0), broke=graded.filter(t=>t.rulesFollowed<t.rulesTotal);
  if(graded.length>=6&&broke.length>=2){ const cost=broke.reduce((a,t)=>a+t.pnl,0);
    if(cost<0) out.push({title:'Breaking your rules',cost:cost,detail:'Your <b>'+broke.length+'</b> rule-break trades netted '+(cost>=0?'+':'-')+m0(cost)+', dragging down your clean trades.',fix:'Treat your checklist as non-negotiable — one unchecked box means no trade.'});
  }
  return out.filter(o=>o.detail).sort((a,b)=>a.cost-b.cost).slice(0,4);
}

  if(!tr.length){ $('#view').innerHTML=`<div class="card">${emptyInner('No reports yet','Log a few trades and EDGE breaks down your edge by symbol, emotion and weekday — showing what actually makes you money.','openLog()','Log a trade')}</div>`; return; }
  const bySym=groupStat(tr,t=>t.symbol), byEmo=groupStat(tr,t=>t.emotion||'—'), byDay=groupStat(tr,t=>new Date(t.date).toLocaleDateString(undefined,{weekday:'short'}));
  const dn=Object.entries((()=>{const m={};tr.forEach(t=>{const d=fmtDate(t.date);(m[d]=m[d]||{pnl:0,n:0,w:0});m[d].pnl+=t.pnl;m[d].n++;if(t.pnl>0)m[d].w++;});return m;})());
  const bestSym=bySym[0], bestEmo=byEmo.slice().sort((a,b)=>b.net-a.net)[0], worstEmo=byEmo.slice().sort((a,b)=>a.net-b.net)[0];
  const maxAbs=Math.max(1,...dn.map(([,v])=>Math.abs(v.pnl)));
  $('#view').innerHTML=`
    <div class="grid kpis">
      ${kpi('Best symbol',bestSym?bestSym.k:'—','win',bestSym?money(bestSym.net):'')}
      ${kpi('Best mood',bestEmo?bestEmo.k:'—','win',bestEmo?money(bestEmo.net):'')}
      ${kpi('Watch mood',worstEmo&&worstEmo.net<0?worstEmo.k:'—','loss',worstEmo&&worstEmo.net<0?money(worstEmo.net):'none yet')}
      ${kpi('Total trades',tr.length+'','','logged so far')}
    </div>
    <div class="card section-gap"><div class="card-title">Daily P&L</div>
      <div style="position:relative;height:170px;margin-top:18px;display:flex;gap:6px;align-items:stretch">
        <div style="position:absolute;left:0;right:0;top:50%;height:1px;background:var(--border-2);pointer-events:none"></div>
        ${dn.map(([d,v])=>{ const h=Math.min(48,Math.max(2.5,Math.abs(v.pnl)/maxAbs*48)); const up=v.pnl>=0; return `<div class="pnl-bar" style="flex:1;position:relative;cursor:pointer" onmousemove="barTip(event,'${d}',${v.pnl},${v.n},${v.w})" onmouseleave="hideTip()"><div class="pnl-fill" style="position:absolute;${up?'bottom':'top'}:50%;left:14%;right:14%;height:${h}%;border-radius:${up?'5px 5px 1px 1px':'1px 1px 5px 5px'};background:${up?'linear-gradient(0deg,rgba(36,209,155,.35),var(--win))':'linear-gradient(180deg,rgba(245,71,107,.35),var(--loss))'};box-shadow:0 4px 14px -6px ${up?'rgba(36,209,155,.6)':'rgba(245,71,107,.6)'};transition:filter .15s"></div></div>`; }).join('')}
      </div>
      <div style="display:flex;gap:6px;margin-top:7px">${dn.map(([d])=>`<div class="hint" style="flex:1;text-align:center;font-size:9px">${(d.split(' ')[1]||d)}</div>`).join('')}</div>
    </div>
    <div class="two-col section-gap"><div class="card">${reportTable('By symbol',bySym)}</div><div class="card">${reportTable('By emotion',byEmo)}</div></div>
    <div class="two-col section-gap"><div class="card">${reportTable('By weekday',byDay)}</div><div class="card">${rrDistribution(tr)}</div></div>
    ${insightsCard(tr)}
    ${improvementCard(tr)}
    ${sessionSection(tr)}
    ${heatmapCard(tr)}
    ${whatIfCard(tr)}
    ${excursionCard(tr)}
    ${holdTimeCard(tr)}
    ${consistencyCard(tr)}
    ${monteCarloCard(tr)}
    ${mistakeReport(tr)}
    ${(()=>{const tg=tagStat(tr);return tg.length?`<div class="card section-gap">${reportTable('By tag',tg)}<div class="hint" style="margin-top:10px">Tag your setups when logging trades to see which ones actually make you money.</div></div>`:`<div class="card section-gap"><div class="card-title">By tag</div><div class="hint" style="margin-top:10px">Add tags like “breakout” or “news” when you log a trade — then see which setups win here.</div></div>`;})()}`;
};
function reviewQueue(){ return Store.trades().filter(t=>{ const broke=t.rulesTotal>0&&t.rulesFollowed<t.rulesTotal; return (t.pnl<0||broke)&&!((t.lesson||'')+'').trim(); }).sort((a,b)=>{ const av=(a.rulesTotal>0&&a.rulesFollowed<a.rulesTotal)?1:0, bv=(b.rulesTotal>0&&b.rulesFollowed<b.rulesTotal)?1:0; if(av!==bv)return bv-av; return a.pnl-b.pnl; }); }
function saveLesson(id){ const el=document.getElementById('lesson-'+id); if(!el)return; const v=el.value.trim(); if(!v){ toast('Write a quick lesson first'); return; } const arr=Store.trades(); const t=arr.find(x=>x.id===id); if(!t)return; t.lesson=v; Store.saveTrades(arr); addXP(8); toast('Lesson saved · +8 XP','good'); VIEWS.journal(); }
function reviewSection(){
  const q=reviewQueue();
  if(!q.length) return '<div class="card section-gap"><div class="card-title">Trades to learn from</div><div class="hint" style="margin-top:8px">Nothing to review — every loss and rule-break has a lesson attached. That\'s exactly how pros compound. 🎯</div></div>';
  const items=q.slice(0,5).map(t=>{ const broke=t.rulesTotal>0&&t.rulesFollowed<t.rulesTotal; return '<div class="card" style="background:var(--card);margin-bottom:12px"><div class="row-sb"><div><b>'+escHtml(t.symbol||'—')+'</b> <span class="tag '+t.side+'">'+t.side+'</span>'+(broke?' <span class="tag" style="background:rgba(245,71,107,.15);color:var(--loss)">rule break</span>':'')+' <span class="hint">'+fmtDate(t.date)+'</span></div><b class="mono '+(t.pnl>=0?'pos':'neg')+'">'+money(t.pnl)+'</b></div>'+((t.mistakes&&t.mistakes.length)?'<div class="hint" style="margin-top:6px">Mistakes: '+t.mistakes.map(escHtml).join(', ')+'</div>':'')+'<textarea class="finp" id="lesson-'+t.id+'" placeholder="What did you learn? What will you do differently next time?" style="margin-top:10px;min-height:64px;width:100%;display:block;box-sizing:border-box"></textarea><button class="btn btn-primary btn-sm" style="margin-top:10px" onclick="saveLesson('+t.id+')">Save lesson (+8 XP)</button></div>'; }).join('');
  return '<div class="card section-gap"><div class="row-sb"><div class="card-title">Trades to learn from</div><span class="chip">'+q.length+' to review</span></div><div class="card-sub">Your losses and rule-breaks are your best teachers — capture the lesson before you forget it.</div><div style="margin-top:14px">'+items+'</div></div>';
}
function lessonsList(){ const done=Store.trades().filter(t=>((t.lesson||'')+'').trim()).slice().reverse(); if(!done.length) return ''; return '<div class="card section-gap"><div class="card-title">Lessons learned</div><div class="card-sub">The playbook you\'re writing from your own trades.</div><div style="margin-top:12px">'+done.slice(0,20).map(t=>'<div class="card" style="background:var(--card);margin-bottom:8px"><div class="row-sb"><b>'+escHtml(t.symbol||'—')+' <span class="hint" style="font-weight:400">'+fmtDate(t.date)+'</span></b><b class="mono '+(t.pnl>=0?'pos':'neg')+'">'+money(t.pnl)+'</b></div><p style="margin:8px 0 0;color:var(--text);line-height:1.5">'+escHtml(t.lesson)+'</p></div>').join('')+'</div></div>'; }
function reviewNudge(){ const q=reviewQueue(); if(!q.length) return ''; return '<button onclick="go(\'journal\')" class="coach-banner" style="width:100%;text-align:left;border:1px solid rgba(245,71,107,.3);border-radius:16px;padding:15px 18px;margin-bottom:18px;cursor:pointer;background:radial-gradient(120% 200% at 100% 0,rgba(245,71,107,.1),transparent 60%);display:flex;align-items:center;gap:13px">'+svgi('book',22,'var(--loss)')+'<span style="flex:1;min-width:0"><b>'+q.length+' trade'+(q.length===1?'':'s')+' to learn from</b> <span class="hint">· turn your losses into lessons</span></span><span style="color:var(--violet-2);font-weight:600;flex:0 0 auto">Review →</span></button>'; }
VIEWS.journal=function(){
  const j=Store.journal(); const today=new Date().toISOString().slice(0,10); const ex=j.find(e=>e.date===today);
  let streak=0; { let d=new Date(); for(;;){ const ds=d.toISOString().slice(0,10); if(j.find(e=>e.date===ds)){streak++; d.setDate(d.getDate()-1);} else break; } }
  const moods=[['Calm','Calm'],['Confident','Confident'],['Focused','Focused'],['Fear','Anxious'],['FOMO','FOMO'],['moon','Tired'],['Greed','Greedy']];
  const micon=k=> k==='moon'? svgi('moon',15,'currentColor') : '<svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px">'+emoIcon(k)+'</svg>';
  const mc={}; j.forEach(e=>{ if(e.mood)mc[e.mood]=(mc[e.mood]||0)+1; }); const mtot=j.length;
  const moodRows=Object.entries(mc).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([m,n])=>`<div class="pbar"><div class="pbar-top"><span>${m}</span><b class="mono">${Math.round(n/mtot*100)}%</b></div><div class="pbar-tr"><div class="pbar-fl" style="width:${Math.max(3,Math.round(n/mtot*100))}%;background:var(--grad)"></div></div></div>`).join('')||'<div class="hint" style="margin-top:8px">Log entries to see your mood mix here.</div>';
  $('#view').innerHTML=`
  <div class="two-col">
    <div class="card"><div class="card-title">Today’s entry</div>
      <div class="flbl" style="margin:14px 0 8px">How are you feeling before the session?</div>
      <div class="chip-list" id="jMoods">${moods.map(([e,m])=>`<button type="button" class="rule-chip${ex&&ex.mood===m?' sel':''}" data-m="${m}" style="cursor:pointer${ex&&ex.mood===m?';background:var(--violet);color:#fff':''}" onclick="document.querySelectorAll('#jMoods .rule-chip').forEach(x=>{x.classList.remove('sel');x.style.background='';x.style.color=''});this.classList.add('sel');this.style.background='var(--violet)';this.style.color='#fff'">${micon(e)} ${m}</button>`).join('')}</div>
      <div class="fgrp full" style="margin-top:14px"><label class="flbl">Pre-market plan</label><textarea class="finp" id="j-plan" placeholder="What are you watching for today? What will you NOT do?">${ex?ex.plan||'':''}</textarea></div>
      <button class="btn btn-primary section-gap" onclick="saveJournal()">Save today’s entry (+10 XP)</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="card" style="text-align:center"><div style="display:flex;justify-content:center">${svgi('flame',42,'var(--violet-2)')}</div><div class="kval violet" style="font-size:42px;margin-top:4px">${streak}</div><div class="hint">day journaling streak</div><div class="hint" style="margin-top:8px">${streak===0?'Write today’s entry to start a streak.':streak<3?'Keep it going — consistency compounds.':'You’re building a real habit.'}</div></div>
      <div class="card"><div class="card-title" style="font-size:15px">Your moods lately</div><div class="card-sub">How you show up before the session</div><div style="margin-top:14px">${moodRows}</div></div>
      <div class="card"><div class="card-title" style="font-size:15px">Journaling tips</div>
        <div style="display:flex;flex-direction:column;gap:11px;margin-top:12px">
          ${['Write it BEFORE you trade — not after.','Name the setups you will and won’t take.','Note your emotional state honestly.','Re-read last week before the open.'].map(t=>`<div style="display:flex;gap:9px;align-items:flex-start">${svgi('pencil',15,'var(--violet-2)')}<span class="hint" style="color:var(--text);line-height:1.4">${t}</span></div>`).join('')}
        </div>
      </div>
    </div>
  </div>
  ${reviewSection()}
  ${lessonsList()}
  <div class="card section-gap"><div class="card-title">Past entries</div><div style="margin-top:12px">${j.slice().reverse().map(e=>`<div class="card" style="background:var(--card);margin-bottom:8px"><div class="row-sb"><b>${fmtDate(e.date)}</b><span class="tag long">${e.mood}</span></div>${e.plan?`<p class="hint" style="margin:8px 0 0;color:var(--muted);line-height:1.5">${e.plan}</p>`:''}</div>`).join('')||'<div class="empty" style="padding:30px"><div class="hint">No entries yet — your journal timeline grows here.</div></div>'}</div></div>`;
};
VIEWS.checklist=function(){

      <div id="cl">${rules.map((r,i)=>`<div class="rule" data-i="${i}"><span class="box"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg></span><span>${r}</span></div>`).join('')||'<div class="hint">Add rules in Playbooks first.</div>'}</div>
      <div class="meter"><div class="mrow"><span id="clTxt">0 of ${rules.length} confirmed</span><b id="clPct">0%</b></div><div class="mtrack"><div class="mfill" id="clFill" style="width:0%"></div></div></div>

function clEval(){ const tot=document.querySelectorAll('#cl .rule').length; const n=document.querySelectorAll('#cl .rule.on').length; const p=tot?Math.round(n/tot*100):0; if($('#clTxt'))$('#clTxt').textContent=n+' of '+tot+' confirmed'; if($('#clPct'))$('#clPct').textContent=p+'%'; if($('#clFill'))$('#clFill').style.width=p+'%';
  const rrMin=+(Store.settings().rrTarget||2); const rrEl=$('#cl-rr'); const rr=(rrEl&&rrEl.value!=='')?+rrEl.value:null; const warn=$('#cl-rr-warn'); let rrBad=false;
  if(rr!=null&&rr<rrMin){ rrBad=true; if(warn){ warn.style.display='block'; warn.textContent='⚠ '+rr.toFixed(1)+':1 is below your '+rrMin+':1 minimum — this setup doesn\'t pay enough. Skip it or find a better entry.'; } if(rrEl)rrEl.style.borderColor='var(--loss)'; }
  else { if(warn)warn.style.display='none'; if(rrEl)rrEl.style.borderColor=''; }
  const go=$('#clGo'); if(go){ const rulesOk=tot>0&&n===tot; const ok=rulesOk&&!rrBad; go.disabled=!ok; go.style.opacity=ok?1:.5; go.textContent=rrBad?'R:R too low — stand down':(rulesOk?'Checklist clear — log this trade →':'Confirm every rule first'); } }
VIEWS.goals=function(){
  const g=Store.goals(); const s=stats();
  function cur(goal){ if(goal.type==='Profit target ($)')return s.net; if(goal.type==='Win rate (%)')return s.wr; if(goal.type==='Trades logged')return s.tr.length; return s.dis; }
  function prog(goal){ return Math.max(0,Math.min(100,cur(goal)/goal.target*100)); }
  const done=g.filter(x=>prog(x)>=100).length;
  const suggest=[['Trades logged',20],['Win rate (%)',60],['Discipline score',90],['Profit target ($)',500]];
  $('#view').innerHTML=`
  <div class="two-col">
    <div class="card"><div class="row-sb"><div><div class="card-title">Your goals</div><div class="card-sub">${g.length} active · ${done} reached</div></div><div class="kval violet" style="font-size:32px">${done}/${g.length||0}</div></div>
      <div class="flbl" style="margin:14px 0 8px">Quick add</div>
      <div class="chip-list">${suggest.map(([t,v])=>`<button class="rule-chip" style="cursor:pointer" onclick="quickGoal('${t}',${v})">＋ ${t.replace(' ($)','').replace(' (%)','')}: ${v}</button>`).join('')}</div>
    </div>
    <div class="card"><div class="card-title" style="font-size:15px">Custom goal</div>
      <div class="form-grid" style="grid-template-columns:1fr 1fr;margin-top:12px">
        <div class="fgrp"><label class="flbl">Type</label><select class="finp" id="g-type"><option>Profit target ($)</option><option>Win rate (%)</option><option>Trades logged</option><option>Discipline score</option></select></div>
        <div class="fgrp"><label class="flbl">Target</label><input class="finp" type="number" id="g-target" placeholder="1000"></div>
        <div class="fgrp full"><label class="flbl">Deadline</label><input class="finp" type="date" id="g-deadline"></div>
      </div>
      <button class="btn btn-primary btn-sm section-gap" onclick="addGoal()">Add goal</button>
    </div>
  </div>
  <div class="section-gap grid" style="grid-template-columns:1fr;gap:12px">${g.map((goal,i)=>{const p=prog(goal),d=p>=100;return `<div class="card"><div class="row-sb"><div style="display:flex;align-items:center;gap:10px">${svgi(d?'trophy':'target',20,d?'var(--gold)':'var(--violet-2)')}<b>${goal.type}</b>${d?'<span class="chip" style="color:var(--win);border-color:rgba(36,209,155,.4)">Reached</span>':''}</div><button class="del-x" onclick="delGoal(${i})">✕</button></div><div class="meter" style="margin-bottom:0"><div class="mrow"><span class="hint">${Math.round(cur(goal))} / ${goal.target}${goal.deadline?' · by '+fmtDate(goal.deadline):''}</span><b>${Math.round(p)}%</b></div><div class="mtrack"><div class="mfill ${d?'win':''}" style="width:${p}%"></div></div></div></div>`;}).join('')||'<div class="card"><div class="empty" style="padding:30px"><div class="hint">No goals yet — add one above to start your climb.</div></div></div>'}</div>
  <div class="card section-gap"><div class="card-title">Your journey</div><div class="card-sub">Milestones on the road to funded</div>
    <div class="ladder">${[['First steps','Log 10 trades',s.tr.length,10],['Building the habit','Log 50 trades',s.tr.length,50],['Consistent','Hold a 50%+ win rate',s.wr,50],['Disciplined','Reach a 90+ discipline score',s.tr.length?s.dis:0,90],['Profitable','Reach +$1,000 net P&L',Math.max(0,s.net),1000]].map(([n,d,c,goal],i)=>{const p=Math.min(100,Math.round(c/goal*100));const done=p>=100;return `<div class="lad-row"><span class="lad-node ${done?'done':''}">${done?svgi('trophy',15,'#fff'):(i+1)}</span><div class="lad-body"><div class="pbar-top"><span style="color:var(--text);font-weight:600">${n}</span><b class="mono">${p}%</b></div><div class="hint" style="margin:2px 0 7px">${d}</div><div class="pbar-tr"><div class="pbar-fl" style="width:${Math.max(2,p)}%;background:var(--grad)"></div></div></div></div>`;}).join('')}</div>
  </div>`;
};

function escHtml(x){ return (x==null?'':String(x)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function coachBrief(){
  const raw=Store.trades().filter(t=>t&&typeof t.pnl==='number'&&!t.open);
  const idx=new Map(raw.map((t,i)=>[t,i]));
  const tr=raw.slice().sort((a,b)=>{ const d=((a.date||'')+'').localeCompare((b.date||'')+''); return d||idx.get(a)-idx.get(b); });
  const s=stats(tr);
  const sub=arr=>{ const n=arr.length, net=arr.reduce((a,t)=>a+t.pnl,0), w=arr.filter(t=>t.pnl>0).length; return {n,net:Math.round(net),winRate:n?Math.round(w/n*100):0}; };
  const graded=tr.filter(t=>t.rulesTotal>0);
  const clean=graded.filter(t=>t.rulesFollowed>=t.rulesTotal), broke=graded.filter(t=>t.rulesFollowed<t.rulesTotal);
  const tagMap={}; tr.forEach(t=>(t.tags||[]).forEach(tag=>{ if(tag==='imported'||tag==='open')return; (tagMap[tag]=tagMap[tag]||[]).push(t); }));
  const byTag={}; Object.keys(tagMap).forEach(k=>byTag[k]=sub(tagMap[k]));
  const emoMap={}; tr.forEach(t=>{ const e=((t.emotion||'')+'').trim(); if(!e)return; (emoMap[e]=emoMap[e]||[]).push(t); });
  const byEmotion={}; Object.keys(emoMap).forEach(k=>byEmotion[k]=sub(emoMap[k]));
  const missMap={}; tr.forEach(t=>(t.mistakes||[]).forEach(mk=>{ (missMap[mk]=missMap[mk]||[]).push(t); }));
  const byMistake={}; Object.keys(missMap).forEach(k=>byMistake[k]=sub(missMap[k]));
  const afterLoss=[]; for(let i=1;i<tr.length;i++){ if(tr[i-1].pnl<0) afterLoss.push(tr[i]); }
  const notes=tr.filter(t=>((t.notes||'')+'').trim()).slice(-12).map(t=>({date:t.date,pnl:Math.round(t.pnl),side:t.side,emotion:t.emotion||'',note:((t.notes||'')+'').slice(0,160)}));
  const pnls=tr.map(t=>t.pnl);
  return {
    range:{from:tr[0]&&tr[0].date,to:tr[tr.length-1]&&tr[tr.length-1].date,trades:tr.length},
    totals:{net:Math.round(s.net),winRate:s.wr,profitFactor:s.pf===Infinity?null:Math.round(s.pf*100)/100,expectancy:Math.round(s.exp),avgWin:Math.round(s.avgWin),avgLoss:Math.round(s.avgLoss),avgRmultiple:s.avgR!=null?Math.round(s.avgR*100)/100:null,maxDrawdown:s.maxDD,avgDiscipline:s.dis,bestTrade:Math.round(Math.max.apply(null,pnls.concat(0))),worstTrade:Math.round(Math.min.apply(null,pnls.concat(0)))},
    disciplineSplit:{cleanRuleTrades:sub(clean),ruleBrokenTrades:sub(broke),timesBrokeRules:broke.length},
    bySide:{long:sub(tr.filter(t=>t.side==='long')),short:sub(tr.filter(t=>t.side==='short'))},
    byTag,byEmotion,byMistake,afterALoss:sub(afterLoss),
    symbols:[...new Set(tr.map(t=>t.symbol).filter(Boolean))].slice(0,10),
    recentNotes:notes
  };
}

function downloadCard(){
  const svg=document.getElementById('shareSvg'); if(!svg){ toast('Card not ready'); return; }
  const xml=new XMLSerializer().serializeToString(svg);
  const url=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml;charset=utf-8'}));
  const img=new Image();
  img.onload=()=>{ const c=document.createElement('canvas'); c.width=1080; c.height=1080; const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,1080,1080); URL.revokeObjectURL(url);
    try{ c.toBlob(b=>{ if(!b){ toast('Could not render — screenshot the card instead'); return; } const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='edge-pro-card.png'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500); toast('Edge Card saved','good'); },'image/png'); }
    catch(e){ toast('Could not render — screenshot the card instead'); } };
  img.onerror=()=>{ URL.revokeObjectURL(url); toast('Could not render — screenshot the card instead'); };
  img.src=url;
}

function equitySVG(tr,acct){ const pts=[acct]; let c=acct; tr.forEach(t=>{c+=t.pnl;pts.push(c);});
  if(pts.length<2||tr.length===0){ return `<div class="hint" style="padding:34px 0;text-align:center">Log trades to draw your equity curve.</div>`; }
  const min=Math.min(...pts),max=Math.max(...pts),range=(max-min)||1,W=500,H=150;
  const path=pts.map((p,i)=>`${i?'L':'M'}${(i/(pts.length-1)*W).toFixed(1)},${(H-(p-min)/range*H).toFixed(1)}`).join(' ');
  const start=pts[0]; const segW=W/pts.length;
  // running discipline (0-100) aligned to the same x-axis — overlaid to show it leads the account
  let dsum=0,dn=0; const disc=[null]; tr.forEach(t=>{ if(t.rulesTotal>0){ dsum+=t.rulesFollowed/t.rulesTotal; dn++; } disc.push(dn?dsum/dn*100:null); });
  const dpts=pts.map((p,i)=>({x:(i/(pts.length-1)*W),y:disc[i]==null?null:(H-(disc[i]/100)*H)})).filter(o=>o.y!=null);

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="240" preserveAspectRatio="none"><defs><linearGradient id="ef" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(124,92,252,.35)"/><stop offset="100%" stop-color="rgba(124,92,252,0)"/></linearGradient><linearGradient id="el" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7C5CFC"/><stop offset="100%" stop-color="#E15CC6"/></linearGradient></defs><path d="${path} L${W},${H} L0,${H} Z" fill="url(#ef)"/><path class="eqline" d="${path}" fill="none" stroke="url(#el)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${discLine}${dots}</svg>${dPath?'<div style="display:flex;gap:16px;margin-top:8px;font-size:11px;color:var(--muted)"><span><i style="display:inline-block;width:14px;height:3px;border-radius:2px;background:var(--grad);vertical-align:middle;margin-right:5px"></i>Equity</span><span><i style="display:inline-block;width:14px;height:0;border-top:2px dashed #FFC43D;vertical-align:middle;margin-right:5px"></i>Discipline</span><span class="hint" style="margin-left:auto">when discipline dips, the account follows</span></div>':''}`; }

function autoInsights(tr){

function animateCounts(root){ if(matchMedia('(prefers-reduced-motion:reduce)').matches)return; const scope=(root&&root.querySelectorAll)?root:document; scope.querySelectorAll('#view .kval,#view .wheel-num,#view .ring-num .n').forEach(el=>{ if(el.dataset.cd)return; const txt=el.textContent; const m=txt.match(/-?\d[\d,]*(?:\.\d+)?/); if(!m)return; const numStr=m[0], idx=m.index; const pre=txt.slice(0,idx), sufNode=el.querySelector('.wheel-pct'); const suf=sufNode?'':txt.slice(idx+numStr.length); const target=parseFloat(numStr.replace(/,/g,'')); if(isNaN(target))return; const dec=(numStr.split('.')[1]||'').length, comma=numStr.indexOf(',')>=0; el.dataset.cd=1; const t0=performance.now(), dur=850; const fmt=v=>{ let n=dec?v.toFixed(dec):Math.round(v)+''; if(comma)n=Number(n).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec}); return n; }; const suffixHtml=sufNode?'<span class="wheel-pct">%</span>':suf; function step(t){ const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3); el.innerHTML=pre+fmt(target*e)+suffixHtml; if(p<1)requestAnimationFrame(step); } requestAnimationFrame(step); }); }
function psychBar(label,val,c1,c2){ return '<div class="pbar"><div class="pbar-top"><span><span class="pdot" style="background:'+c1+'"></span>'+label+'</span><b>'+val+'%</b></div><div class="pbar-tr"><div class="pbar-fl" style="width:'+val+'%;background:linear-gradient(90deg,'+c1+','+c2+')"></div></div></div>'; }
function psychMetrics(s){
  const disc=s.tr.length?s.dis:0;
  const tiltCtrl=s.tilt!=null?Math.max(0,Math.round((5-s.tilt)/4*100)):(s.tr.length?100:0);
  let gc=0,bc=0; s.tr.forEach(t=>{ if(['Calm','Confident','Focused'].includes(t.emotion))gc++; else if(['Fear','FOMO','Greed','Revenge'].includes(t.emotion))bc++; });
  const cons=(gc+bc)?Math.round(gc/(gc+bc)*100):(s.tr.length?60:0);
  const psi=Math.round((disc+tiltCtrl+cons)/3);
  const psiLbl=psi>=85?'Rock solid':psi>=70?'Composed':psi>=50?'Steady':'Rebuilding';
  return '<div class="card"><div class="row-sb"><div class="card-title">Mental Edge</div><span class="chip">live</span></div><div class="card-sub">Your inner game, scored in real time</div>'
    +'<div style="margin-top:16px">'

    +'<div class="pbar-tr" style="height:11px"><div class="pbar-fl" style="width:'+psi+'%;background:linear-gradient(90deg,#F5476B,#FFC43D 50%,#24D19B)"></div></div>'

}
function fillStats(s){

  const days=new Set(tr.map(t=>t.date)).size; const strk=discStreak();

}

function startSeasonParticles(mode,pcol){
  const cv=document.createElement('canvas'); cv.id='seasonCv'; cv.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:60'; document.body.appendChild(cv); const ctx=cv.getContext('2d');

  const conf=({ snow:{n:80,color:'rgba(255,255,255,.9)',glow:'rgba(255,255,255,.6)',minR:1,maxR:3.4,minS:.3,maxS:1,sway:true},
    spooky:{n:20,emoji:['🦇','🎃','👻','🕸️'],minR:16,maxR:30,minS:.25,maxS:.7},
    hearts:{n:28,emoji:['💗','💜','❤️','🌹'],minR:14,maxR:28,minS:.4,maxS:.95},
    confetti:{n:90,rect:true,minR:3,maxR:8,minS:1.1,maxS:3} })[mode]||{n:40,color:'rgba(255,255,255,.7)',minR:1,maxR:3,minS:.4,maxS:.9};
  const cols=['#FFC43D','#FF5C8A','#7C5CFC','#24D19B','#6AA9FF',pcol||'#FFD873'];
  const P=Array.from({length:conf.n},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:conf.minR+Math.random()*(conf.maxR-conf.minR),s:conf.minS+Math.random()*(conf.maxS-conf.minS),d:Math.random()*.8-.4,ph:Math.random()*6.28,rot:Math.random()*6,vr:Math.random()*.12-.06,e:conf.emoji?conf.emoji[Math.floor(Math.random()*conf.emoji.length)]:null,c:cols[Math.floor(Math.random()*cols.length)]}));
  (function loop(){ ctx.clearRect(0,0,cv.width,cv.height); P.forEach(p=>{ p.y+=p.s; p.ph+=.02; p.x+=p.d+(conf.sway?Math.sin(p.ph)*.5:0); p.rot+=p.vr; if(p.y>cv.height+34){ p.y=-34; p.x=Math.random()*cv.width; }
    if(p.e){ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*.12); ctx.font=p.r+'px serif'; ctx.globalAlpha=.9; ctx.fillText(p.e,0,0); ctx.restore(); }
    else if(conf.rect){ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.shadowColor=p.c; ctx.shadowBlur=6; ctx.fillStyle=p.c; ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*.5); ctx.restore(); }
    else { ctx.save(); ctx.beginPath(); ctx.shadowColor=conf.glow||conf.color; ctx.shadowBlur=8; ctx.fillStyle=conf.color; ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); ctx.restore(); } });
    window._seasonRAF=requestAnimationFrame(loop); })();

async function doCloudPush(attempt){
  if(!window.SB || !window._uid) return;
  setSyncState('saving');

    const { error } = await window.SB.from('journals').upsert({ user_id:window._uid, data:d, updated_at:new Date().toISOString() });
