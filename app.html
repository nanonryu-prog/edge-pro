<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EDGE Pro — Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    color-scheme:dark;
    --bg:#0A0A16; --bg-2:#0E0E20; --surface:#12122A; --surface-2:#16162E; --card:rgba(255,255,255,0.02);
    --border:rgba(255,255,255,0.07); --border-2:rgba(255,255,255,0.13);
    --text:#F4F4FB; --muted:rgba(244,244,251,0.60); --faint:rgba(244,244,251,0.38);
    --violet:#7C5CFC; --violet-2:#9D7BFF; --pink:#E15CC6;
    --grad:linear-gradient(135deg,#7C5CFC 0%,#A45CFC 45%,#E15CC6 100%);
    --win:#24D19B; --loss:#F5476B; --gold:#FFC43D; --blue:#6AA9FF; --track:rgba(255,255,255,0.08);
    --ease:cubic-bezier(0.16,1,0.3,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;letter-spacing:-0.011em;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Space Grotesk','Inter',sans-serif;letter-spacing:-0.02em;margin:0;}
  a{color:inherit;text-decoration:none;}
  .mono{font-family:'JetBrains Mono',monospace;}
  ::-webkit-scrollbar{width:9px;height:9px;} ::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:6px;}

  .shell{display:grid;grid-template-columns:250px 1fr;min-height:100dvh;}
  @media(max-width:900px){ .shell{grid-template-columns:1fr;} .sidebar{position:fixed;left:-260px;top:0;bottom:0;z-index:60;transition:left .25s var(--ease);} .sidebar.open{left:0;} .hamb{display:grid!important;} .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:55;} .scrim.on{display:block;} }

  /* sidebar */
  .sidebar{background:var(--bg-2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 14px;height:100dvh;position:sticky;top:0;overflow-y:auto;}
  .brand{display:flex;align-items:center;gap:6px;font-family:'Space Grotesk';font-weight:700;font-size:21px;padding:4px 8px 22px;}
  .brand .p{color:var(--violet-2);}
  .nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:500;font-size:14px;cursor:pointer;border:none;background:transparent;width:100%;text-align:left;transition:background .16s var(--ease),color .16s var(--ease);}
  .nav-item svg{width:17px;height:17px;flex:none;opacity:.85;}
  .nav-item:hover{background:rgba(255,255,255,0.04);color:var(--text);}
  .nav-item.active{background:rgba(124,92,252,0.16);color:var(--violet-2);font-weight:600;}
  .side-xp{margin-top:14px;padding:12px;border:1px solid var(--border);border-radius:12px;}
  .side-xp .row{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.06em;color:var(--faint);font-weight:600;text-transform:uppercase;}
  .xp-track{height:6px;border-radius:5px;background:rgba(255,255,255,0.08);margin-top:9px;overflow:hidden;} .xp-fill{height:100%;background:var(--grad);border-radius:5px;transition:width .7s var(--ease);}
  .trial{margin-top:12px;padding:14px;border-radius:13px;background:radial-gradient(120% 100% at 0 0,rgba(124,92,252,0.18),transparent 70%),var(--surface);border:1px solid var(--border);}
  .trial p{font-size:12.5px;color:var(--muted);margin:0 0 10px;}
  .trial b{color:var(--text);}

  /* main */
  main{min-width:0;display:flex;flex-direction:column;}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(10,10,22,0.82);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 28px;}
  .topbar h1{font-size:23px;}
  .topbar .sub{font-size:12.5px;color:var(--faint);margin-top:3px;}
  .top-right{display:flex;align-items:center;gap:12px;}
  .sess-pill{display:none;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:8px 14px;}
  @media(min-width:680px){ .sess-pill{display:inline-flex;} }
  .sess-pill b{color:var(--violet-2);font-family:'JetBrains Mono';}
  .icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,0.04);color:var(--muted);display:grid;place-items:center;cursor:pointer;}
  .icon-btn:hover{color:var(--text);}
  .hamb{display:none;}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-weight:700;font-size:15px;cursor:pointer;}
  .content{padding:26px 28px 60px;max-width:1280px;width:100%;}
  @media(max-width:900px){ .content,.topbar{padding-left:16px;padding-right:16px;} }

  /* buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:11px;font-weight:600;font-size:14px;cursor:pointer;border:1px solid transparent;transition:transform .16s var(--ease),box-shadow .2s,background .2s;font-family:inherit;}
  .btn-primary{background:var(--grad);color:#fff;box-shadow:0 8px 22px rgba(124,92,252,0.4);}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(124,92,252,0.55);}
  .btn-ghost{background:rgba(255,255,255,0.05);border-color:var(--border-2);color:var(--text);}
  .btn-ghost:hover{background:rgba(255,255,255,0.1);}
  .btn-danger{background:rgba(245,71,107,0.14);border-color:rgba(245,71,107,0.3);color:var(--loss);}
  .btn-sm{height:36px;padding:0 14px;font-size:13px;}
  .btn-full{width:100%;}

  /* cards + grid */
  .grid{display:grid;gap:16px;}
  .kpis{grid-template-columns:repeat(2,1fr);}
  @media(min-width:760px){ .kpis{grid-template-columns:repeat(4,1fr);} }
  .card{background:linear-gradient(180deg,var(--surface),var(--bg-2));border:1px solid var(--border);border-radius:16px;padding:20px;}
  .kcard{position:relative;}
  .klabel{font-family:'JetBrains Mono';font-size:11px;text-transform:uppercase;letter-spacing:0.09em;color:var(--faint);font-weight:500;}
  .kval{font-family:'JetBrains Mono';font-weight:700;font-size:30px;margin-top:12px;letter-spacing:-.01em;}
  .kval.win{color:var(--win);} .kval.loss{color:var(--loss);} .kval.violet{color:var(--violet-2);}
  .ksub{font-size:12px;color:var(--faint);margin-top:8px;}
  .badge{position:absolute;top:18px;right:18px;font-family:'JetBrains Mono';font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:.05em;}
  .badge.good{background:rgba(36,209,155,0.14);color:var(--win);border:1px solid rgba(36,209,155,0.3);}
  .grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .card-title{font-size:17px;font-weight:600;} .card-sub{font-size:12.5px;color:var(--faint);margin-top:2px;}
  .row-sb{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .two-col{display:grid;gap:16px;grid-template-columns:1fr;} @media(min-width:960px){ .two-col{grid-template-columns:1.5fr 1fr;} }
  .section-gap{margin-top:16px;}
  .chip{font-family:'JetBrains Mono';font-size:11px;padding:3px 9px;border-radius:6px;border:1px solid var(--border-2);color:var(--violet-2);}
  .pct-pill{font-family:'JetBrains Mono';font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px;background:rgba(36,209,155,0.14);color:var(--win);}
  .pct-pill.neg{background:rgba(245,71,107,0.14);color:var(--loss);}

  /* discipline breakdown */
  .dbrk{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
  .dbrk:last-child{border-bottom:none;}
  .dbrk .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:9px;}
  .ring-wrap{position:relative;width:150px;height:150px;}
  .ring-num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;}
  .ring-num .n{font-family:'JetBrains Mono';font-weight:700;font-size:32px;color:var(--violet-2);}
  .ring-num .o{font-family:'JetBrains Mono';font-size:10px;color:var(--faint);letter-spacing:.1em;}

  /* table */
  .tbl{width:100%;border-collapse:collapse;font-size:13.5px;}
  .tbl th{text-align:left;font-family:'JetBrains Mono';font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--border);}
  .tbl td{padding:12px;border-bottom:1px solid var(--border);}
  .tbl tr:last-child td{border-bottom:none;}
  .tbl tr:hover td{background:rgba(255,255,255,0.02);}
  .tag{display:inline-flex;padding:3px 9px;border-radius:6px;font-size:11.5px;font-weight:600;font-family:'JetBrains Mono';}
  .tag.long{background:rgba(36,209,155,0.14);color:var(--win);} .tag.short{background:rgba(245,71,107,0.14);color:var(--loss);}
  .pos{color:var(--win);} .neg{color:var(--loss);}
  .del-x{background:transparent;border:none;color:var(--faint);cursor:pointer;padding:4px;border-radius:6px;} .del-x:hover{color:var(--loss);background:rgba(245,71,107,0.12);}

  /* forms */
  .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;} @media(min-width:640px){ .form-grid{grid-template-columns:repeat(3,1fr);} }
  .fgrp{display:flex;flex-direction:column;gap:6px;} .fgrp.full{grid-column:1/-1;}
  .flbl{font-size:12px;color:var(--muted);font-weight:500;}
  .finp{height:44px;border-radius:10px;border:1px solid var(--border-2);background:rgba(255,255,255,0.04);color:var(--text);padding:0 13px;font-size:14px;font-family:inherit;}
  textarea.finp{height:auto;min-height:80px;padding:11px 13px;resize:vertical;}
  select.finp{cursor:pointer;} .finp:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,92,252,0.18);}

  /* checklist / rules */
  .rule{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--border);border-radius:11px;margin-bottom:8px;cursor:pointer;transition:.2s;}
  .rule:hover{border-color:var(--border-2);} .rule.on{border-color:rgba(36,209,155,0.4);background:rgba(36,209,155,0.08);}
  .rule .box{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--border-2);display:grid;place-items:center;flex:none;color:transparent;} .rule.on .box{background:var(--win);border-color:var(--win);color:#04120c;}
  .chip-list{display:flex;flex-wrap:wrap;gap:8px;}
  .rule-chip{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:rgba(124,92,252,0.1);border:1px solid rgba(124,92,252,0.3);font-size:13px;}
  .rule-chip button{background:none;border:none;color:var(--faint);cursor:pointer;font-size:15px;}
  .rule-chip button:hover{color:var(--loss);}

  /* meters */
  .meter{margin:14px 0;} .meter .mrow{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px;} .meter .mrow b{font-family:'JetBrains Mono';}
  .mtrack{height:8px;border-radius:6px;background:rgba(255,255,255,0.07);overflow:hidden;} .mfill{height:100%;border-radius:6px;background:var(--grad);}
  .mfill.win{background:linear-gradient(90deg,var(--win),#5fe0b8);} .mfill.loss{background:linear-gradient(90deg,var(--loss),#ff7a94);}

  /* achievements */
  .ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;}
  .ach{padding:16px;border-radius:13px;border:1px solid var(--border);background:var(--card);text-align:center;opacity:.42;transition:.25s;}
  .ach.on{opacity:1;border-color:rgba(255,196,61,0.35);background:rgba(255,196,61,0.06);}
  .ach .ic{font-size:24px;margin-bottom:8px;} .ach .an{font-size:13px;font-weight:600;} .ach .ad{font-size:11px;color:var(--faint);margin-top:3px;}

  /* calendar */
  .cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;} .cal-dow span{text-align:center;font-size:10.5px;color:var(--faint);font-weight:600;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-day{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;border:1px solid var(--border);background:var(--card);color:var(--faint);}
  .cal-day .pl{font-weight:700;font-size:10px;} .cal-day.win{background:rgba(36,209,155,0.14);border-color:rgba(36,209,155,0.32);} .cal-day.win .pl{color:var(--win);}
  .cal-day.loss{background:rgba(245,71,107,0.13);border-color:rgba(245,71,107,0.3);} .cal-day.loss .pl{color:var(--loss);}
  .cal-day.slip{background:rgba(255,196,61,0.13);border-color:rgba(255,196,61,0.34);} .cal-day.slip .pl{color:var(--gold);}

  .empty{text-align:center;padding:48px 20px;color:var(--muted);} .empty .ei{width:56px;height:56px;border-radius:15px;background:rgba(124,92,252,0.12);border:1px solid rgba(124,92,252,0.28);display:grid;place-items:center;margin:0 auto 14px;color:var(--violet-2);} .empty h3{font-size:17px;margin-bottom:6px;}
  .hint{font-size:12px;color:var(--faint);}
  .insight{display:flex;gap:11px;align-items:flex-start;padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--card);font-size:14px;line-height:1.5;}
  .insight .ci{width:24px;height:24px;border-radius:7px;flex:none;display:grid;place-items:center;background:rgba(36,209,155,0.14);color:var(--win);}

  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(5,5,12,0.7);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:80;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;}
  .modal-bg.show{display:flex;}
  .modal{background:linear-gradient(180deg,var(--surface),var(--bg-2));border:1px solid var(--border-2);border-radius:18px;padding:24px;max-width:760px;width:100%;box-shadow:0 40px 100px rgba(0,0,0,0.6);}
  .modal-x{background:transparent;border:none;color:var(--faint);cursor:pointer;font-size:22px;line-height:1;}

  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface-2);border:1px solid var(--border-2);color:var(--text);padding:13px 20px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 16px 40px rgba(0,0,0,0.5);opacity:0;pointer-events:none;transition:.3s var(--ease);z-index:100;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);} #toast.good{border-color:rgba(36,209,155,0.4);}

/* ===== Light / Dark theming ===== */
:root[data-theme="light"]{
  --bg:#F4F5FB; --bg-2:#FFFFFF; --surface:#FFFFFF; --surface-2:#EDEFF7; --card:rgba(18,20,45,0.025);
  --border:rgba(18,20,45,0.10); --border-2:rgba(18,20,45,0.16);
  --text:#141428; --muted:rgba(20,22,45,0.64); --faint:rgba(20,22,45,0.46);
  --win:#0FA678; --loss:#E23860; --track:rgba(18,20,45,0.10);
}
[data-theme="light"] body{background:radial-gradient(1100px 600px at 50% -10%,rgba(124,92,252,.10),transparent 60%),var(--bg);}
[data-theme="light"] .sidebar{background:#FFFFFF;}
[data-theme="light"] .topbar{background:rgba(255,255,255,0.85);}
[data-theme="light"] .nav-item:hover{background:rgba(18,20,45,0.05);}
[data-theme="light"] .btn-ghost{background:rgba(18,20,45,0.04);}
[data-theme="light"] .icon-btn{background:rgba(18,20,45,0.04);}
[data-theme="light"] .finp{background:#FFFFFF;}
[data-theme="light"] .card,[data-theme="light"] .kcard{background:linear-gradient(180deg,#FFFFFF,#FBFBFE);}
[data-theme="light"] .rule:hover,[data-theme="light"] .tbl tr:hover td{background:rgba(18,20,45,0.03);}
[data-theme="light"] .xp-track,[data-theme="light"] .mtrack{background:rgba(18,20,45,0.09);}
[data-theme="light"] .cal-day{background:rgba(18,20,45,0.02);}
[data-theme="light"] .modal,[data-theme="light"] .menu{background:#FFFFFF;}
[data-theme="light"] #toast{background:#FFFFFF;color:#141428;}
[data-theme="light"] .modal-bg{background:rgba(20,22,45,0.35);}
[data-theme="light"] ::-webkit-scrollbar-thumb{background:#D6D8E6;}
[data-theme="light"] .kval:not(.win):not(.loss):not(.violet){color:#141428;}
/* account menu */
.avatar-wrap{position:relative;}
.menu{position:absolute;right:0;top:50px;width:240px;background:var(--surface-2);border:1px solid var(--border-2);border-radius:14px;padding:8px;box-shadow:0 24px 60px rgba(0,0,0,.45);display:none;z-index:70;}
.menu.open{display:block;}
.menu-head{padding:10px 12px 12px;border-bottom:1px solid var(--border);margin-bottom:6px;}
.menu-head .mn{font-weight:600;font-size:14px;} .menu-head .me{font-size:12px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:none;color:var(--text);font-size:13.5px;font-weight:500;padding:10px 12px;border-radius:9px;cursor:pointer;font-family:inherit;text-decoration:none;}
.menu-item:hover{background:rgba(124,92,252,.14);color:var(--violet-2);}
.menu-item.danger:hover{background:rgba(245,71,107,.12);color:var(--loss);}
.menu-theme{display:flex;gap:4px;padding:6px 6px 8px;}
.menu-theme button{flex:1;padding:7px 4px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11.5px;cursor:pointer;font-family:inherit;}
.menu-theme button.on{background:rgba(124,92,252,.16);color:var(--violet-2);border-color:rgba(124,92,252,.4);}
.set-section{margin-bottom:16px;}
.set-section h3{font-size:15px;margin-bottom:4px;}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);}
.toggle:last-child{border-bottom:none;}
.sw{width:42px;height:24px;border-radius:999px;background:var(--track);position:relative;cursor:pointer;transition:.2s;flex:none;}
.sw.on{background:var(--violet);} .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;} .sw.on::after{left:21px;}
</style>
<script>(function(){var p=localStorage.getItem("edgepro_theme")||"auto";var t=p;if(p==="auto"){var h=new Date().getHours();t=(h>=7&&h<19)?"light":"dark";}document.documentElement.setAttribute("data-theme",t);})();</script>
</head>
<body>
<div class="scrim" id="scrim" onclick="toggleNav(false)"></div>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <a href="index.html" class="brand" title="Back to site">EDGE&nbsp;<span class="p">Pro</span></a>
    <nav id="sideNav" style="display:flex;flex-direction:column;gap:2px;"></nav>
    <div class="side-xp">
      <div class="row"><span>Level <span id="xpLvl">1</span></span><span id="xpTxt" class="mono">0/100 XP</span></div>
      <div class="xp-track"><div class="xp-fill" id="xpFill" style="width:0%"></div></div>
    </div>
    <div class="trial">
      <p>On <b>Pro trial</b> — 7 days left.</p>
      <a href="index.html#pricing" class="btn btn-primary btn-sm btn-full">Upgrade plan</a>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;min-width:0;">
        <button class="icon-btn hamb" onclick="toggleNav(true)" aria-label="Menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div style="min-width:0"><h1 id="pageTitle">Dashboard</h1><div class="sub" id="pageSub">Your trading at a glance</div></div>
      </div>
      <div class="top-right">
        <span class="sess-pill">Session in <b id="sessCount">–</b></span>
        <button class="icon-btn" id="themeBtn" title="Theme" onclick="cycleTheme()"></button>
        <button class="btn btn-primary btn-sm" onclick="openLog()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Log trade</button>
        <div class="avatar-wrap">

function stats(){
  const tr=Store.trades(); const acct=Store.settings().account||10000;
  const wins=tr.filter(t=>t.pnl>0), losses=tr.filter(t=>t.pnl<0);
  const gw=wins.reduce((a,t)=>a+t.pnl,0), gl=Math.abs(losses.reduce((a,t)=>a+t.pnl,0));
  const net=tr.reduce((a,t)=>a+t.pnl,0);
  const wr=tr.length?Math.round(wins.length/tr.length*100):0;
  const pf=gl?(gw/gl):(gw?Infinity:0);
  const exp=tr.length?net/tr.length:0;
  const rrArr=tr.filter(t=>t.rr); const avgRR=rrArr.length?rrArr.reduce((a,t)=>a+t.rr,0)/rrArr.length:null;
  const avgWin=wins.length?gw/wins.length:0, avgLoss=losses.length?gl/losses.length:0;
  const tiltArr=tr.filter(t=>t.tilt!=null); const tilt=tiltArr.length?tiltArr.reduce((a,t)=>a+t.tilt,0)/tiltArr.length:null;
  const disTr=tr.filter(t=>t.rulesTotal>0); const dis=disTr.length?Math.round(disTr.reduce((a,t)=>a+t.rulesFollowed/t.rulesTotal,0)/disTr.length*100):100;
  const broken=disTr.reduce((a,t)=>a+(t.rulesFollowed<t.rulesTotal?1:0),0);
  const rulesFollowed=disTr.filter(t=>t.rulesFollowed===t.rulesTotal).length;
  const slips=tr.filter(t=>t.pnl>0&&t.rulesTotal>0&&t.rulesFollowed<t.rulesTotal).length;
  return {tr,acct,wins:wins.length,losses:losses.length,net,wr,pf,exp,avgRR,avgWin,avgLoss,tilt,dis,broken,rulesFollowed,slips};
}

VIEWS.calendar=function(){
  const tr=Store.trades(); const now=new Date(),y=now.getFullYear(),m=now.getMonth(); const byDay={};
  tr.forEach(t=>{ const d=new Date(t.date); if(d.getFullYear()===y&&d.getMonth()===m){ const dd=d.getDate(); (byDay[dd]=byDay[dd]||{pl:0,slip:false}); byDay[dd].pl+=t.pnl; if(t.rulesTotal>0&&t.rulesFollowed<t.rulesTotal)byDay[dd].slip=true; } });
  const first=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate(); let cells=''; for(let i=0;i<first;i++)cells+='<div></div>';
  for(let d=1;d<=dim;d++){ const e=byDay[d]; let c='cal-day',inner=`<span>${d}</span>`; if(e){ c+=e.slip?' slip':(e.pl>=0?' win':' loss'); inner+=`<span class="pl">${e.pl>=0?'+':'-'}$${Math.abs(Math.round(e.pl))}</span>`; } cells+=`<div class="${c}">${inner}</div>`; }
  const net=tr.filter(t=>{const d=new Date(t.date);return d.getFullYear()===y&&d.getMonth()===m;}).reduce((a,t)=>a+t.pnl,0);
  $('#view').innerHTML=`<div class="card" style="max-width:640px"><div class="row-sb"><div class="card-title">${now.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</div><b class="${net>=0?'pos':'neg'} mono">${money(net)}</b></div>
    <div class="card-sub" style="margin:4px 0 12px">Green = profit · Red = loss · Gold = rule slip</div>
    <div class="cal-dow"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div><div class="cal-grid">${cells}</div></div>`;
};

/* ---- helpers ---- */
function kpi(label,val,cls,sub,extra=''){ return `<div class="card kcard">${extra}<div class="klabel">${label}</div><div class="kval ${cls}">${val}</div><div class="ksub">${sub}</div></div>`; }
function emptyInner(h,p,fn,btn){ return `<div class="empty"><div class="ei"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg></div><h3>${h}</h3><p style="max-width:36ch;margin:0 auto 16px">${p}</p><button class="btn btn-primary" onclick="${fn}">${btn}</button></div>`; }
function tradeTable(tr,del){ if(!tr.length)return '<div class="hint">No trades.</div>';
  return `<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Date</th><th>Symbol</th><th>Side</th><th>R:R</th><th>Rules</th><th style="text-align:right">P&L</th>${del?'<th></th>':''}</tr></thead><tbody>${tr.map(t=>`<tr><td class="mono">${fmtDate(t.date)}</td><td style="font-weight:600">${t.symbol}</td><td><span class="tag ${t.side}">${t.side}</span></td><td class="mono">${t.rr?t.rr.toFixed(2):'–'}</td><td class="mono">${t.rulesTotal?t.rulesFollowed+'/'+t.rulesTotal:'–'}</td><td style="text-align:right;font-weight:700" class="${t.pnl>=0?'pos':'neg'}">${money(t.pnl)}</td>${del?`<td style="text-align:right"><button class="del-x" onclick="delTrade(${t.id})">✕</button></td>`:''}</tr>`).join('')}</tbody></table></div>`; }
function equitySVG(tr,acct){ const pts=[acct]; let c=acct; tr.forEach(t=>{c+=t.pnl;pts.push(c);});
  if(pts.length<2||tr.length===0){ return `<div class="hint" style="padding:34px 0;text-align:center">Log trades to draw your equity curve.</div>`; }
  const min=Math.min(...pts),max=Math.max(...pts),range=(max-min)||1,W=500,H=150;
  const path=pts.map((p,i)=>`${i?'L':'M'}${(i/(pts.length-1)*W).toFixed(1)},${(H-(p-min)/range*H).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="150" preserveAspectRatio="none"><defs><linearGradient id="ef" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(124,92,252,.35)"/><stop offset="100%" stop-color="rgba(124,92,252,0)"/></linearGradient><linearGradient id="el" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7C5CFC"/><stop offset="100%" stop-color="#E15CC6"/></linearGradient></defs><path d="${path} L${W},${H} L0,${H} Z" fill="url(#ef)"/><path d="${path}" fill="none" stroke="url(#el)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }
function ring(pct){ const r=42,c=2*Math.PI*r,off=c-(pct/100)*c; return `<div class="ring-wrap"><svg width="150" height="150" viewBox="0 0 100 100"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--track)" stroke-width="10"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="url(#rg)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 50 50)"/><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7C5CFC"/><stop offset="100%" stop-color="#E15CC6"/></linearGradient></defs></svg><div class="ring-num"><div><div class="n">${pct}</div><div class="o">OF 100</div></div></div></div>`; }
function meter(label,cur,tgt,cls){ const p=tgt?Math.max(0,Math.min(100,cur/tgt*100)):0; return `<div class="meter"><div class="mrow"><span>${label}</span><b>${money0(cur)}</b></div><div class="mtrack"><div class="mfill ${cls}" style="width:${p}%"></div></div></div>`; }
function insights(s){ const out=[]; if(!s.tr.length){out.push('Log your first trade and EDGE will start surfacing patterns here.');}
  else{ if(s.dis>=90)out.push(`Discipline at ${s.dis}/100 — exactly the consistency backers want to see.`); else if(s.broken>0)out.push(`You broke your rules on ${s.broken} trade${s.broken>1?'s':''}. Those are the leaks to close first.`);
    if(s.slips>0)out.push(`${s.slips} “rule-slip” win${s.slips>1?'s':''} — profitable, but off-plan. Don’t let them become habits.`);
    if(s.wr>=50&&s.pf>1.5)out.push(`Win rate ${s.wr}% with a ${s.pf===Infinity?'∞':s.pf.toFixed(2)} profit factor — a genuine edge. Keep sizing consistent.`);
    if(s.net<0)out.push(`Net ${money(s.net)} so far. Focus on discipline over P&L while you rebuild.`); }
  return out.slice(0,3).map(t=>`<div class="insight"><span class="ci"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg></span><span>${t}</span></div>`).join('<div style="height:8px"></div>'); }
function groupStat(tr,keyFn){ const m={}; tr.forEach(t=>{const k=keyFn(t);(m[k]=m[k]||{n:0,net:0,w:0}); m[k].n++; m[k].net+=t.pnl; if(t.pnl>0)m[k].w++;}); return Object.entries(m).map(([k,v])=>({k,n:v.n,net:v.net,wr:Math.round(v.w/v.n*100)})).sort((a,b)=>b.net-a.net); }
function reportTable(title,rows){ return `<div class="card-title">${title}</div><div style="overflow-x:auto;margin-top:12px"><table class="tbl"><thead><tr><th>${title.replace('By ','')}</th><th>Trades</th><th>Win %</th><th style="text-align:right">Net</th></tr></thead><tbody>${rows.map(r=>`<tr><td style="font-weight:600">${r.k}</td><td class="mono">${r.n}</td><td class="mono">${r.wr}%</td><td style="text-align:right;font-weight:700" class="${r.net>=0?'pos':'neg'}">${money(r.net)}</td></tr>`).join('')}</tbody></table></div>`; }
function dayNets(tr){ const m={}; tr.forEach(t=>{const d=t.date;m[d]=(m[d]||0)+t.pnl;}); return Object.values(m); }
function runningDD(tr,acct){ let peak=acct,c=acct,dd=[]; tr.forEach(t=>{c+=t.pnl; peak=Math.max(peak,c); dd.push(c-peak);}); return dd.length?dd:[0]; }
function discStreak(){ const tr=Store.trades(); let s=0; for(let i=tr.length-1;i>=0;i--){ if(tr[i].rulesTotal>0&&tr[i].rulesFollowed===tr[i].rulesTotal)s++; else break; } return s; }

/* ---- session countdown ---- */
function tickSession(){ const now=new Date(); const t=new Date(now); t.setHours(20,30,0,0); if(t<now)t.setDate(t.getDate()+1); let s=Math.floor((t-now)/1000); const h=Math.floor(s/3600),mn=Math.floor(s%3600/60),sc=s%60; $('#sessCount').textContent=`${h}h ${mn}m ${sc}s`; }

/* ---- theme ---- */
const SUN='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';
function getThemePref(){ return localStorage.getItem('edgepro_theme')||'auto'; }
function resolveTheme(p){ if(p!=='auto')return p; const h=new Date().getHours(); return (h>=7&&h<19)?'light':'dark'; }
function applyTheme(){ const pref=getThemePref(), t=resolveTheme(pref); document.documentElement.setAttribute('data-theme',t);
  const b=$('#themeBtn'); if(b){ b.innerHTML=t==='light'?SUN:MOON; b.title='Theme: '+pref+(pref==='auto'?' ('+t+')':''); }
  document.querySelectorAll('.menu-theme button').forEach(x=>x.classList.toggle('on',x.dataset.theme===pref)); }
function setTheme(p){ localStorage.setItem('edgepro_theme',p); applyTheme(); toast('Theme: '+p); }
function cycleTheme(){ const o=['auto','light','dark']; setTheme(o[(o.indexOf(getThemePref())+1)%3]); }

/* ---- account menu ---- */
function toggleMenu(force){ const m=$('#userMenu'); const open=force===undefined?!m.classList.contains('open'):force; m.classList.toggle('open',open); }
document.addEventListener('click',e=>{ if(!e.target.closest('.avatar-wrap')) toggleMenu(false); });

/* ---- data export / import / delete ---- */
const DATA_KEYS=['trades','playbooks','journal','goals','eval','profile','weeks','settings'];
function exportData(){ const out={}; DATA_KEYS.forEach(b=>out[b]=Store.get(b,null)); const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='edgepro-'+session.email+'.json'; a.click(); toast('Data exported','good'); }
function importData(input){ const f=input.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); DATA_KEYS.forEach(b=>{ if(d[b]!=null) Store.set(b,d[b]); }); toast('Data imported','good'); renderXP(); go('dash'); }catch{ toast('Invalid file'); } }; r.readAsText(f); }
function deleteAccount(){ if(!confirm('Permanently delete your account and all data on this device?'))return; try{ const u=JSON.parse(localStorage.getItem('edgepro_users')||'{}'); delete u[session.email]; localStorage.setItem('edgepro_users',JSON.stringify(u)); }catch{} DATA_KEYS.forEach(b=>localStorage.removeItem(Store.k(b))); Store.logout(); }

/* ---- init ---- */
$('#avatar').textContent=(session.name||session.email||'T').trim()[0].toUpperCase();
$('#mName').textContent=session.name||'Trader'; $('#mEmail').textContent=session.email;
buildNav(); renderXP(); applyTheme(); go('dash'); tickSession(); setInterval(tickSession,1000); setInterval(applyTheme,60000);
</script>
